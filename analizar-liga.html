<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analizar liga — Suertudo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">

    <header class="hero">
      <h1>Analizar liga</h1>
      <p class="tagline">Cargá el CSV del backtest y mirá qué mercados aguantan (misma política de picks que la app).</p>
    </header>

    <section class="panel">
      <h2 class="panel-title">Cargar CSV de backtest</h2>
      <label for="csv-file">Archivo <code>comparacion_[LIGA]_[FECHA].csv</code></label>
      <input type="file" id="csv-file" accept=".csv,text/csv">
      <div class="field" style="margin-top:12px;">
        <label for="liga-select">Liga a analizar (se detecta sola; corregila si hace falta)</label>
        <select id="liga-select"></select>
      </div>
      <p id="csv-info" style="margin-top:8px; font-size:0.85rem; color:var(--text-dim,#8b95a5);"></p>
    </section>

    <section id="resultado" style="display:none;">

      <section class="panel" id="veredicto-panel">
        <h2 class="panel-title">Veredicto</h2>
        <div id="veredicto-content"></div>
      </section>

      <section class="panel">
        <h2 class="panel-title">Mercados</h2>
        <div id="tasa-content"></div>
      </section>

      <section class="panel">
        <h2 class="panel-title">Config para leagues.js</h2>
        <pre id="config-json" style="background:var(--bg); padding:14px; border-radius:8px; font-family:'IBM Plex Mono',monospace; font-size:0.78rem; line-height:1.5; overflow-x:auto; color:var(--text); white-space:pre;"></pre>
      </section>

    </section>

    <section class="panel">
      <h2 class="panel-title">Navegación</h2>
      <div class="tools-list">
        <a href="index.html">🏠 Volver al inicio</a>
        <a href="backtest.html">🎯 Backtest</a>
        <a href="walkforward.html">🧭 Walk-forward</a>
      </div>
    </section>

  </div>

<script type="module">
  import { LIGAS, getFiltroEV } from './leagues.js';
  import { generarPicks, hitPick, ODDS_CAMPO } from './picks.js';
  import { roiBootstrap } from './roi-ci.js';
  import { leerRegistro, estadoPorLiga } from './registro.js';

  const LABELS = {
    local: '1X2 · Local gana', empate: '1X2 · Empate', visitante: '1X2 · Visitante gana',
    dc1X: '1X (Local o Empate)', dcX2: 'X2 (Empate o Visitante)',
    over15: 'Over 1.5', over25: 'Over 2.5', over35: 'Over 3.5',
    under15: 'Under 1.5', under25: 'Under 2.5', under35: 'Under 3.5',
    bttsSi: 'BTTS Sí', bttsNo: 'BTTS No',
    c_over75: 'Over 7.5 córners', c_over85: 'Over 8.5 córners', c_over95: 'Over 9.5 córners',
  };
  // Tasa de acierto de equilibrio aproximada (cuotas típicas). Si hay cuotas en el CSV
  // el criterio principal es el ROI con intervalo de confianza, no este mínimo.
  const MIN_TASA = {
    local: 55, empate: 30, visitante: 55, dc1X: 78, dcX2: 78,
    over15: 88, over25: 68, over35: 55, under15: 90, under25: 78, under35: 75,
    bttsSi: 62, bttsNo: 62, c_over75: 65, c_over85: 65, c_over95: 65,
  };
  const MIN_MUESTRA = 30;
  const MIN_APUESTAS_ROI = 20;
  const Z = 1.64;

  const fileInput = document.getElementById('csv-file');
  const csvInfo = document.getElementById('csv-info');
  const ligaSelect = document.getElementById('liga-select');
  const resultadoDiv = document.getElementById('resultado');
  let filas = [];

  for (const [k, l] of Object.entries(LIGAS)) ligaSelect.appendChild(new Option(l.name + ' (' + k + ')', k));

  // ---------- CSV ----------
  function parseLinea(l) {
    const out = []; let cur = ''; let q = false;
    for (let i = 0; i < l.length; i++) {
      const c = l[i];
      if (q) {
        if (c === '"') { if (l[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === ',') { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    return out;
  }
  function parseCSV(texto) {
    const lineas = texto.replace(/^\ufeff/, '').split(/\r?\n/).filter(l => l.trim());
    if (lineas.length < 2) return [];
    const headers = parseLinea(lineas[0]);
    const out = [];
    for (let i = 1; i < lineas.length; i++) {
      const campos = parseLinea(lineas[i]);
      const row = {};
      for (let j = 0; j < headers.length; j++) row[headers[j]] = campos[j];
      out.push(row);
    }
    return out;
  }
  const num = (v) => {
    if (v === undefined || v === null || String(v).trim() === '') return null;
    const n = parseFloat(v);
    return Number.isFinite(n) ? n : null;
  };

  function detectarLiga(nombre, rows) {
    const col = rows[0] && rows[0].liga_key;
    if (col && LIGAS[col]) return col;
    const m = Object.keys(LIGAS).find(k => new RegExp('_' + k + '_', 'i').test(nombre));
    return m || Object.keys(LIGAS)[0];
  }

  function wilsonLow(h, n) {
    if (!n) return 0;
    const p = h / n, z2 = Z * Z;
    const centro = p + z2 / (2 * n);
    const margen = Z * Math.sqrt(p * (1 - p) / n + z2 / (4 * n * n));
    return (centro - margen) / (1 + z2 / n);
  }

  // ---------- análisis: MISMA política de picks que la app ----------
  function analizar(rows, ligaKey) {
    const st = {};
    for (const k of Object.keys(LABELS)) st[k] = { key: k, label: LABELS[k], mercado: null, n: 0, hits: 0, sumProb: 0, bets: [], sinEV: 0 };
    let total = 0;

    for (const f of rows) {
      const gl = num(f.REAL_goles_local), gv = num(f.REAL_goles_visitante);
      const pl = num(f.APP_local), pe = num(f.APP_empate), pv = num(f.APP_visitante);
      if (gl == null || gv == null || pl == null || pe == null || pv == null) continue;
      total++;
      const real = { gl: gl, gv: gv, corners: num(f.REAL_corners_total) };
      const c7 = num(f.APP_corners_over75), c8 = num(f.APP_corners_over85), c9 = num(f.APP_corners_over95);
      const data = {
        resultProbs: { local: pl, empate: pe, visitante: pv },
        over15: num(f.APP_over15), over25: num(f.APP_over25), over35: num(f.APP_over35),
        btts: num(f.APP_btts),
        cornerProbs: (c7 != null && c8 != null && c9 != null) ? { over7: c7, over8: c8, over9: c9 } : null,
        sinRating: [],
      };
      const picks = generarPicks(data, ligaKey, { ignorarConfig: true });
      for (const pk of picks) {
        const hit = hitPick(pk.key, real);
        const s = st[pk.key];
        if (hit == null || !s) continue;
        s.mercado = pk.mercado; s.n++; s.sumProb += pk.prob;
        if (hit) s.hits++;
        const campo = ODDS_CAMPO[pk.key];
        const cuota = campo ? num(f['CASA_' + campo]) : null;
        if (cuota != null && cuota > 1) {
          if ((pk.prob / 100) * cuota > getFiltroEV(pk.mercado)) s.bets.push({ cuota: cuota, hit: hit });
          else s.sinEV++;
        }
      }
    }

    const resumen = Object.values(st).filter(s => s.n > 0).map(s => {
      const tasa = s.hits / s.n * 100;
      const low = wilsonLow(s.hits, s.n) * 100;
      const min = MIN_TASA[s.key];
      const roi = s.bets.length >= MIN_APUESTAS_ROI ? roiBootstrap(s.bets) : null;
      let nivel = 'no';
      if (s.n >= MIN_MUESTRA) {
        if (roi && roi.roi != null) {
          if (roi.ic[0] > 0) nivel = 'solido';
          else if (roi.roi > 0 && tasa >= min) nivel = 'prometedor';
        } else if (low >= min) nivel = 'solido';
        else if (tasa >= min) nivel = 'prometedor';
      }
      return { key: s.key, label: s.label, mercado: s.mercado, n: s.n, tasa: tasa, low: low, min: min,
        probMedia: s.sumProb / s.n, roi: roi, nBets: s.bets.length, sinEV: s.sinEV, nivel: nivel };
    });
    return { resumen: resumen, total: total };
  }

  // ---------- render ----------
  const ICONO = { solido: '✅', prometedor: '🟡', no: '' };

  function evidenciaReal(ligaKey) {
    let e = null;
    try { e = estadoPorLiga(leerRegistro())[ligaKey]; } catch (err) { e = null; }
    return e || { n: 0, nivel: 'pocos', media: null, consejo: 'Sin picks con cuota y cierre cargados.' };
  }

  function renderVeredicto(res, ligaKey) {
    const solidos = res.resumen.filter(r => r.nivel === 'solido');
    const prom = res.resumen.filter(r => r.nivel === 'prometedor');
    const aptos = solidos.length + prom.length;
    let titulo, color;
    if (solidos.length >= 2) { titulo = '✅ LIGA VERDE — ' + solidos.length + ' mercados sólidos'; color = 'var(--green)'; }
    else if (aptos >= 1) { titulo = '⚠️ LIGA AMARILLA — ' + aptos + ' mercado' + (aptos > 1 ? 's' : '') + ' a vigilar'; color = 'var(--yellow)'; }
    else { titulo = '❌ LIGA ROJA — ningún mercado aguanta'; color = 'var(--red)'; }

    const fila = (r) => {
      const extra = r.roi ? ' · ROI ' + (r.roi.roi >= 0 ? '+' : '') + r.roi.roi + '% [' + r.roi.ic[0] + ', ' + r.roi.ic[1] + ']' : ' · piso ' + r.low.toFixed(1) + '%';
      return '<div class="compare-row" style="grid-template-columns:1.3fr 1fr 2fr;"><span>' + ICONO[r.nivel] + ' ' + r.label + '</span><span class="grid-plain">' + r.n + ' picks</span><span class="grid-plain">' + r.tasa.toFixed(1) + '%' + extra + '</span></div>';
    };
    document.getElementById('veredicto-content').innerHTML =
      '<div class="card" style="border:2px solid ' + color + ';"><h3 style="color:' + color + ';">' + titulo + '</h3>' +
      '<p style="margin:6px 0 0; font-size:0.85rem;">' + LIGAS[ligaKey].name + ' · partidos analizados: <strong>' + res.total + '</strong></p>' +
      (solidos.length ? '<h4 style="margin:14px 0 6px; font-size:0.85rem;">Sólidos (' + solidos.length + ')</h4>' + solidos.map(fila).join('') : '') +
      (prom.length ? '<h4 style="margin:14px 0 6px; font-size:0.85rem;">Prometedores (' + prom.length + ')</h4>' + prom.map(fila).join('') : '') +
      '<p style="margin:10px 0 0; font-size:0.78rem; color:var(--text-dim); line-height:1.5;">' +
        '⚠️ Este CSV sale del backtest, que ajusta sobre los mismos partidos (in-sample). Probando varios mercados, alguno sale bien por azar. ' +
        '<br><strong>Evidencia real (registro, CLV):</strong> ' + (function () { const ev = evidenciaReal(ligaKey); return (ev.n ? ev.n + ' picks · CLV ' + (ev.media >= 0 ? '+' : '') + ev.media.toFixed(2) + '% · ' : '') + ev.consejo; })() + '<br>' +
        'Sólido = ROI con IC95% > 0 (si hay ≥' + MIN_APUESTAS_ROI + ' apuestas con cuota) o piso de acierto ≥ mínimo. Confirmalo con walk-forward y con el registro antes de subir el stake.</p></div>';
  }

  function renderTasas(res) {
    const orden = [...res.resumen].sort((a, b) => b.tasa - a.tasa);
    const filasHtml = orden.map(r => {
      const col = r.nivel === 'solido' ? 'var(--green)' : r.nivel === 'prometedor' ? 'var(--yellow)' : 'var(--red)';
      const marca = ICONO[r.nivel] || (r.n < MIN_MUESTRA ? '⚠️' : '');
      const roiTxt = r.roi ? (r.roi.roi >= 0 ? '+' : '') + r.roi.roi + '%' : (r.nBets ? r.nBets + ' c/cuota' : '—');
      return '<div class="compare-row" style="grid-template-columns:1.4fr .6fr .8fr .8fr .8fr;"><span>' + marca + ' ' + r.label + '</span>' +
        '<span class="grid-plain">' + r.n + '</span>' +
        '<span class="grid-plain">' + r.probMedia.toFixed(1) + '%</span>' +
        '<span class="grid-plain" style="color:' + col + '">' + r.tasa.toFixed(1) + '% (mín ' + r.min + ')</span>' +
        '<span class="grid-plain">' + roiTxt + '</span></div>';
    }).join('');
    document.getElementById('tasa-content').innerHTML =
      '<div class="card"><div class="compare-row compare-head" style="grid-template-columns:1.4fr .6fr .8fr .8fr .8fr;"><span>Mercado</span><span>Picks</span><span>Predicho</span><span>Acierto</span><span>ROI</span></div>' +
      (filasHtml || '<div class="compare-row"><span>Ningún pick generado con los umbrales de la liga.</span></div>') +
      '<p style="margin:10px 0 0; font-size:0.78rem; color:var(--text-dim); line-height:1.5;">⚠️ = menos de ' + MIN_MUESTRA + ' picks. Los picks son los que generaría la app (umbrales y reglas de la liga, un solo Over por partido, 1X2 suprimido si hay DC), sin mirar la whitelist actual.</p></div>';
  }

  function renderConfig(res, ligaKey) {
    const buenos = res.resumen.filter(r => r.nivel === 'solido' || r.nivel === 'prometedor');
    const solidos = res.resumen.filter(r => r.nivel === 'solido');
    const mercados = [];
    for (const r of buenos) if (r.mercado && !mercados.includes(r.mercado)) mercados.push(r.mercado);
    let status = 'red', stake = 0;
    if (solidos.length >= 2) { status = 'green'; stake = 1; }
    else if (buenos.length >= 2) { status = 'yellow'; stake = 0.5; }
    else if (buenos.length === 1) { status = 'yellow'; stake = 0.3; }

    // Tope por evidencia real: el verde solo con CLV confirmado en el registro.
    const real = evidenciaReal(ligaKey);
    let notaReal = '';
    if (status === 'green' && real.nivel !== 'confirmada') {
      status = 'yellow'; stake = 0.5;
      notaReal = ' Verde pendiente: CLV real ' + (real.n ? 'sin confirmar (' + real.n + ' picks)' : 'sin datos') + '.';
    }
    if (status !== 'red' && real.nivel === 'sin_ventaja') {
      status = 'yellow'; stake = Math.min(stake, 0.3);
      notaReal = ' CLV real ≤ 0 (' + real.n + ' picks): no promover.';
    }

    const config = {};
    config[ligaKey] = { betting: { status: status, stake: stake, mercados: mercados,
      nota: 'analizar-liga: ' + solidos.length + ' sólidos, ' + (buenos.length - solidos.length) + ' prometedores (in-sample).' + notaReal } };
    if (status === 'red') config[ligaKey].betting = { status: 'red' };

    document.getElementById('config-json').textContent = JSON.stringify(config, null, 2) + '\n\n' +
      '// Mercados: ' + (mercados.length ? mercados.join(', ') : '(ninguno)') + '\n' +
      '// Status: ' + status + ' · Stake: ' + stake + '%\n' +
      '// Reemplazá el bloque "betting" de ' + ligaKey + ' en LIGAS de leagues.js.\n' +
      '// La whitelist es exacta: "BTTS Sí", "BTTS No" y "Córners" van por separado.';
  }

  function correr() {
    if (!filas.length) return;
    const ligaKey = ligaSelect.value;
    const res = analizar(filas, ligaKey);
    renderVeredicto(res, ligaKey);
    renderTasas(res);
    renderConfig(res, ligaKey);
    resultadoDiv.style.display = 'block';
  }

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      filas = parseCSV(await file.text());
      if (filas.length === 0) { csvInfo.textContent = '❌ El CSV está vacío o mal formado.'; return; }
      ligaSelect.value = detectarLiga(file.name || '', filas);
      csvInfo.textContent = '✅ ' + filas.length + ' partidos cargados · liga ' + ligaSelect.value;
      correr();
    } catch (err) {
      csvInfo.textContent = '❌ Error: ' + err.message;
    }
  });
  ligaSelect.addEventListener('change', correr);
</script>
</body>
</html>
