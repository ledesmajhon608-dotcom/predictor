<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bet Analytics PRO</title>
    <style>
        :root { --bg: #0a0e17; --card: #131925; --accent: #ff4d5a; --green: #2ecc71; --yellow: #f1c40f; --text: #f0f2f8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; min-height: 100vh; }
        .container { max-width: 500px; margin: auto; }
        .card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        h2 { text-align: center; margin-bottom: 15px; font-size: 24px; }
        select, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 10px; background: rgba(255,255,255,0.06); color: white; border: 1px solid rgba(255,255,255,0.2); font-size: 16px; -webkit-appearance: none; }
        button { background: var(--accent); font-weight: bold; border: none; cursor: pointer; }
        .market { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 12px; margin: 8px 0; }
        .market-header { font-weight: bold; margin-bottom: 8px; color: var(--accent); }
        .prob-row { display: flex; justify-content: space-between; align-items: center; margin: 5px 0; }
        .bar { flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin: 0 10px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 3px; width: 0; transition: width 1s; }
        .green { color: var(--green); } .yellow { color: var(--yellow); } .red { color: var(--accent); }
        .value-badge { font-size: 12px; padding: 2px 8px; border-radius: 20px; background: rgba(46,204,113,0.2); color: var(--green); margin-left: 5px; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2>⚽ BET ANALYTICS PRO</h2>
        <label>Liga</label>
        <select id="league"></select>
        <label>Local</label>
        <select id="home" disabled><option>-- Liga --</option></select>
        <label>Visitante</label>
        <select id="away" disabled><option>-- Liga --</option></select>
        <button id="predict" disabled>CALCULAR PROBABILIDADES</button>
    </div>
    <div id="result" class="card hidden"></div>
</div>
<script>
    const API = '';
    async function loadLeagues() {
        const res = await fetch(API+'/api/leagues');
        const data = await res.json();
        const sel = document.getElementById('league');
        sel.innerHTML = '<option value="">-- Selecciona --</option>';
        data.forEach(l => sel.innerHTML += `<option value="${l.code}">${l.name}</option>`);
    }
    document.getElementById('league').onchange = async function() {
        const code = this.value;
        const homeSel = document.getElementById('home');
        const awaySel = document.getElementById('away');
        homeSel.innerHTML = '<option>Cargando...</option>';
        awaySel.innerHTML = '<option>Cargando...</option>';
        if(!code) return;
        const res = await fetch(API+'/api/teams?league='+code);
        const teams = await res.json();
        const opts = teams.map(t => `<option value="${t}">${t}</option>`).join('');
        homeSel.innerHTML = '<option value="">-- Local --</option>'+opts;
        awaySel.innerHTML = '<option value="">-- Visitante --</option>'+opts;
        homeSel.disabled = false; awaySel.disabled = false;
        checkButton();
    };
    function checkButton() {
        document.getElementById('predict').disabled = !(document.getElementById('home').value && document.getElementById('away').value);
    }
    document.getElementById('home').onchange = checkButton;
    document.getElementById('away').onchange = checkButton;

    document.getElementById('predict').onclick = async () => {
        const league = document.getElementById('league').value;
        const home = document.getElementById('home').value;
        const away = document.getElementById('away').value;
        const res = await fetch(API+`/api/predict?league=${league}&home=${encodeURIComponent(home)}&away=${encodeURIComponent(away)}`);
        const data = await res.json();
        renderResult(data);
    };

    function colorFor(p) { return p >= 65 ? 'green' : p >= 45 ? 'yellow' : ''; }
    function barHtml(label, prob, value) {
        let v = value !== undefined && value !== null ? value : null;
        let valClass = v > 0 ? 'value-badge green' : '';
        let valText = v !== null ? ` (+${(v*100).toFixed(1)}%)` : '';
        return `<div class="prob-row">
            <span style="min-width:110px;font-size:14px;">${label}</span>
            <div class="bar"><div class="bar-fill" style="width:0;background:${colorFor(prob)==='green'?'var(--green)':colorFor(prob)==='yellow'?'var(--yellow)':'var(--accent)'}" data-width="${prob}%"></div></div>
            <span class="${colorFor(prob)}" style="min-width:40px;text-align:right;">${prob}%${valText}</span>
        </div>`;
    }

    function renderResult(d) {
        const card = document.getElementById('result');
        card.classList.remove('hidden');
        let html = `<h3>${d.home} vs ${d.away} (${d.league})</h3>`;
        if(d.odds) html += `<p style="text-align:center;font-size:12px;color:#aaa;">Cuotas Bet365 cargadas</p>`;
        html += `<div class="market"><div class="market-header">RESULTADO</div>
            ${barHtml('Local', d.result.home_win, d.value?.home_win)}
            ${barHtml('Empate', d.result.draw, null)}
            ${barHtml('Visitante', d.result.away_win, d.value?.away_win)}
        </div>
        <div class="market"><div class="market-header">GOLES TOTALES</div>
            ${barHtml('Over 1.5', d.goals.over15, null)}
            ${barHtml('Over 2.5', d.goals.over25, d.value?.over25)}
        </div>
        <div class="market"><div class="market-header">PRIMERA MITAD</div>
            ${barHtml('Over 0.5 HT', d.ht_goals.over05, null)}
            ${barHtml('Over 1.5 HT', d.ht_goals.over15, null)}
        </div>
        <div class="market"><div class="market-header">AMBOS MARCAN</div>
            ${barHtml('BTTS (Sí)', d.btts, d.value?.btts)}
        </div>
        <div class="market"><div class="market-header">CÓRNERS</div>
            ${barHtml('Over 7.5', d.corners.over75, null)}
            ${barHtml('Over 8.5', d.corners.over85, null)}
        </div>`;
        card.innerHTML = html;
        setTimeout(() => {
            document.querySelectorAll('.bar-fill[data-width]').forEach(b => b.style.width = b.dataset.width);
        }, 50);
    }
    loadLeagues();
</script>
</body>
</html>
