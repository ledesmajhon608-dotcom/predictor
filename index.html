<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOOTBALLBET ELITE</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --border: #30363d;
            --text: #f0f6fc; --muted: #8b949e; --accent: #ff5e6c;
            --green: #39d353; --yellow: #dba520;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg); color: var(--text);
            font-family: 'DM Sans', sans-serif; display: flex; justify-content: center;
            padding: 15px; background-image: radial-gradient(circle at top, #1c2128 0%, #0d1117 100%);
        }
        .container { width: 100%; max-width: 440px; }
        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 3.5rem; letter-spacing: 2px; color: #e6edf3; }
        .engine-tag { 
            background: rgba(255, 94, 108, 0.1); color: var(--accent);
            padding: 4px 15px; border-radius: 20px; font-size: 0.7rem; font-weight: bold;
            border: 1px solid rgba(255, 94, 108, 0.3); display: inline-block;
        }
        .main-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .api-status-bar {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            padding: 10px 15px; border-radius: 12px; display: flex; align-items: center;
            gap: 10px; font-size: 0.7rem; font-weight: bold; margin-bottom: 20px;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: 0.3s; }
        .dot.active { background: var(--green); box-shadow: 0 0 10px var(--green); }
        .dot.loading { background: var(--yellow); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
        
        .section-label { font-size: 0.65rem; color: var(--muted); font-weight: 800; text-transform: uppercase; margin: 15px 0 8px; letter-spacing: 1px; }
        .league-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px; }
        .league-btn { 
            background: #21262d; border: 1px solid var(--border); color: var(--muted);
            padding: 8px 4px; border-radius: 12px; font-size: 0.65rem; font-weight: bold;
            cursor: pointer; transition: 0.2s; text-align: center;
        }
        .league-btn.active { background: #30363d; border-color: var(--accent); color: white; }
        .vs-container { display: flex; gap: 10px; margin: 20px 0; align-items: center; }
        .select-group { flex: 1; }
        select { 
            width: 100%; background: #0d1117; border: 1px solid var(--border);
            color: white; padding: 12px; border-radius: 12px; font-size: 0.8rem; outline: none;
        }
        .market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .market-btn {
            background: rgba(35, 134, 54, 0.05); border: 1px solid rgba(57, 211, 83, 0.2);
            color: #39d353; padding: 10px; border-radius: 20px; font-size: 0.7rem;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .calc-btn {
            width: 100%; background: var(--accent); color: white; border: none;
            padding: 18px; border-radius: 18px; font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem; margin-top: 20px; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">FOOTBALLBET</div>
        <div class="engine-tag">⚡ MOTOR ELITE V2.1 ACTIVADO</div>
    </div>

    <div class="main-card">
        <div class="api-status-bar">
            <div class="dot" id="status-dot"></div>
            <span id="status-text">ESPERANDO SELECCIÓN...</span>
        </div>

        <div class="section-label">Liga / Competencia</div>
        <div class="league-grid" id="league-pills"></div>

        <div class="vs-container">
            <div class="select-group">
                <div class="section-label">🏠 Local</div>
                <select id="home-team" disabled><option>— Elige Liga —</option></select>
            </div>
            <div class="select-group">
                <div class="section-label">✈️ Visitante</div>
                <select id="away-team" disabled><option>— Elige Liga —</option></select>
            </div>
        </div>

        <div class="section-label">Mercados Habilitados</div>
        <div class="market-grid">
            <div class="market-btn">⏱️ HT</div>
            <div class="market-btn">⚽ Goles</div>
            <div class="market-btn">🤝 BTTS</div>
            <div class="market-btn">⛳ Córners</div>
        </div>

        <button class="calc-btn" onclick="alert('Calculando con ELO y BSD...')">CALCULAR PROBABILIDADES</button>
    </div>
</div>

<script>
const BSD_TOKEN = 'd1c591c865f3f9dd0d9f8d60337c895a94c4683e';
const BSD_BASE = 'https://sports.bzzoiro.com/api';

const LIGAS = {
    "PL": { n: "Premier League", bsd: "Premier League" },
    "BL1": { n: "Bundesliga", bsd: "Bundesliga" },
    "DED": { n: "Eredivisie", bsd: "Eredivisie" },
    "B1": { n: "Jupiler Pro League", bsd: "Jupiler Pro League" },
    "FL1": { n: "Ligue 1", bsd: "Ligue 1" },
    "SA": { n: "Serie A", bsd: "Serie A" },
    "PD": { n: "La Liga", bsd: "La Liga" },
    "MX": { n: "Liga MX", bsd: "Liga MX" },
    "LIB": { n: "Libertadores", bsd: "Copa Libertadores" },
    "MLS": { n: "MLS", bsd: "MLS" }
};

async function loadTeams(key) {
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const h = document.getElementById('home-team');
    const a = document.getElementById('away-team');
    
    // UI en estado de carga
    statusDot.className = 'dot loading';
    statusText.innerText = "CONECTANDO CON BSD API...";
    h.disabled = true; a.disabled = true;

    // CONTROLADOR DE TIEMPO (Si tarda más de 8s, aborta)
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 8000);

    try {
        const url = `${BSD_BASE}/teams?league=${encodeURIComponent(LIGAS[key].bsd)}&token=${BSD_TOKEN}`;
        const res = await fetch(url, { signal: controller.signal });
        const data = await res.json();
        
        clearTimeout(timeoutId);

        h.innerHTML = '<option value="">— Seleccionar —</option>';
        a.innerHTML = '<option value="">— Seleccionar —</option>';

        if(data.teams && data.teams.length > 0) {
            data.teams.forEach(t => {
                const opt = new Option(t.name, t.id);
                h.add(opt.cloneNode(true));
                a.add(opt.cloneNode(true));
            });
            statusDot.className = 'dot active';
            statusText.innerText = `CONECTADO: ${LIGAS[key].n} (${data.teams.length} EQ)`;
        } else {
            throw new Error("Sin datos");
        }
    } catch (e) {
        // MODO SEGURO: Carga equipos genéricos si la API falla o tarda
        statusDot.className = 'dot';
        statusText.innerText = "API LENTA: USANDO MODO LOCAL";
        h.innerHTML = '<option value="">— Elige Local —</option>';
        a.innerHTML = '<option value="">— Elige Visitante —</option>';
        
        ["Equipo Local 1", "Equipo Local 2", "Equipo Visitante 1"].forEach(name => {
            h.add(new Option(name, name)); a.add(new Option(name, name));
        });
    }
    h.disabled = false; a.disabled = false;
}

function init() {
    const container = document.getElementById('league-pills');
    Object.keys(LIGAS).forEach(key => {
        const btn = document.createElement('div');
        btn.className = 'league-btn';
        btn.innerText = LIGAS[key].n;
        btn.onclick = () => {
            document.querySelectorAll('.league-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadTeams(key);
        };
        container.appendChild(btn);
    });
}

window.onload = init;
</script>
</body>
</html>
