// ============ MODELO MATEMÁTICO ============
function poissonPMF(k, lambda) {
    if (lambda <= 0 || k < 0) return 0;
    let logP = -lambda + k * Math.log(lambda);
    for (let i = 1; i <= k; i++) logP -= Math.log(i);
    return Math.exp(logP);
}

function poissonCDF(k, lambda) {
    let sum = 0;
    for (let i = 0; i <= Math.floor(k); i++) sum += poissonPMF(i, lambda);
    return Math.min(1, sum);
}

function probOver(lambda, threshold) {
    return Math.max(0, Math.min(100, (1 - poissonCDF(threshold, lambda)) * 100));
}

function getTeamStrength(league, team) {
    const leagueData = TEAM_STRENGTH[league] || {};
    return leagueData[team] || [1.0, 1.0, 1.06];
}

function predictMatch(leagueCode, home, away) {
    const config = LEAGUES_CONFIG[leagueCode];
    const goalsAvg = config.goals_avg;
    const cornersAvg = config.corners_avg;
    
    const [hAtk, hDef, hAdv] = getTeamStrength(leagueCode, home);
    const [aAtk, aDef, aAdv] = getTeamStrength(leagueCode, away);
    
    const homeAdv = hAdv || 1.06;
    
    const lh = (goalsAvg / 2) * hAtk * aDef * homeAdv;
    const la = (goalsAvg / 2) * aAtk * hDef * (1 / homeAdv);
    const totalLambda = lh + la;
    
    // Resultado
    let homeWin = 0, awayWin = 0;
    for (let i = 0; i <= 12; i++) {
        for (let j = 0; j <= 12; j++) {
            const prob = poissonPMF(i, lh) * poissonPMF(j, la);
            if (i > j) homeWin += prob;
            else if (j > i) awayWin += prob;
        }
    }
    const draw = 1 - homeWin - awayWin;
    
    // BTTS
    const p0h = poissonPMF(0, lh);
    const p0a = poissonPMF(0, la);
    const btts = Math.max(0, Math.min(100, (1 - p0h - p0a + p0h * p0a) * 100));
    
    // Primera mitad (~43% de goles totales)
    const htLambda = totalLambda * 0.42;
    
    // Córners
    const lambdaCorners = cornersAvg * 1.02;
    
    function probCorners(threshold) {
        return probOver(lambdaCorners, threshold);
    }
    
    return {
        home, away,
        league: config.name,
        l_home: lh.toFixed(3),
        l_away: la.toFixed(3),
        goals: {
            over15: probOver(totalLambda, 1.5).toFixed(1),
            over25: probOver(totalLambda, 2.5).toFixed(1)
        },
        btts: btts.toFixed(1),
        result: {
            home_win: (homeWin * 100).toFixed(1),
            draw: (draw * 100).toFixed(1),
            away_win: (awayWin * 100).toFixed(1)
        },
        ht_goals: {
            over05: probOver(htLambda, 0.5).toFixed(1),
            over15: probOver(htLambda, 1.5).toFixed(1)
        },
        corners: {
            over75: probCorners(7.5).toFixed(1),
            over85: probCorners(8.5).toFixed(1)
        }
    };
}

const resultCard = document.getElementById('result-card');

    const code = this.value;
    homeSelect.innerHTML = '<option value="">-- Local --</option>';
    awaySelect.innerHTML = '<option value="">-- Visitante --</option>';
    homeSelect.disabled = true;
    awaySelect.disabled = true;
    predictBtn.disabled = true;

    const teams = TEAMS_DB[code] || [];
    if (teams.length === 0) {
        homeSelect.innerHTML = '<option>Error: liga sin datos</option>';
        return;
    }
    
    teams.forEach(team => {
        homeSelect.innerHTML += `<option value="${team}">${team}</option>`;
        awaySelect.innerHTML += `<option value="${team}">${team}</option>`;
    });
    
    homeSelect.disabled = false;
    awaySelect.disabled = false;
});

function checkButton() {
    predictBtn.disabled = !(homeSelect.value && awaySelect.value && homeSelect.value !== awaySelect.value);
}

homeSelect.addEventListener('change', checkButton);
awaySelect.addEventListener('change', checkButton);

predictBtn.addEventListener('click', () => {
    const league = leagueSelect.value;
    const home = homeSelect.value;
    const away = awaySelect.value;
    
    if (home === away) {
        alert('Selecciona equipos diferentes');
        return;
    }
    
    resultCard.classList.remove('hidden');
    resultCard.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);">Calculando...</div>';
    resultCard.scrollIntoView({ behavior: 'smooth' });
    
    setTimeout(() => {
        try {
            const pred = predictMatch(league, home, away);
            renderResult(pred);
        } catch (e) {
            resultCard.innerHTML = '<div class="error-msg">Error al calcular. Intenta de nuevo.</div>';
        }
    }, 200);
});

function colorFor(p) {
    const val = parseFloat(p);
    if (val >= 65) return 'green';
    if (val >= 45) return 'yellow';
    return 'red';
}

function barHtml(label, prob) {
    const cls = colorFor(prob);
    const barColor = cls === 'green' ? 'var(--green)' : cls === 'yellow' ? 'var(--yellow)' : 'var(--accent)';
    return `
        <div class="prob-row">
            <span class="prob-label">${label}</span>
            <div class="bar-wrap">
                <div class="bar-fill" data-width="${prob}%" style="background:${barColor};box-shadow:0 0 8px ${barColor};"></div>
            </div>
            <span class="prob-value ${cls}">${prob}%</span>
        </div>`;
}
