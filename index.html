<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CornerIQ Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#0a0e17; --card:rgba(16,20,32,0.7); --card2:rgba(22,27,42,0.8); --border:rgba(255,255,255,0.08);
            --text:#f0f2f8; --muted:#7b8aa6; --accent:#ff4d5a; --accent-glow:rgba(255,77,90,0.5);
            --yellow:#ffb627; --yellow-glow:rgba(255,182,39,0.5);
            --green:#2ecc71; --green-glow:rgba(46,204,113,0.5);
            --blue:#4dabf7; --purple:#9775fa;
            --glass-bg:rgba(255,255,255,0.03);
        }
        *{box-sizing:border-box;margin:0;padding:0;}
        body{
            background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;
            min-height:100vh;display:flex;justify-content:center;padding:20px 15px 60px;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -10%,rgba(255,77,90,0.15) 0%,transparent 70%),
                radial-gradient(ellipse 60% 40% at 80% 80%,rgba(46,204,113,0.08) 0%,transparent 60%),
                radial-gradient(ellipse 50% 35% at 20% 60%,rgba(77,171,247,0.06) 0%,transparent 50%),
                repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,0.015) 39px,rgba(255,255,255,0.015) 40px),
                repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,255,255,0.015) 39px,rgba(255,255,255,0.015) 40px);
        }
        .container{width:100%;max-width:440px;}

        .header{
            text-align:center;padding:28px 20px 20px;margin-bottom:8px;
            background:var(--glass-bg);backdrop-filter:blur(20px);
            border-radius:20px;border:1px solid rgba(255,255,255,0.06);
            position:relative;overflow:hidden;
        }
        .logo{
            font-family:'Bebas Neue',sans-serif;font-size:3rem;letter-spacing:4px;color:white;line-height:1;
            text-shadow:0 0 30px var(--accent-glow);
            background:linear-gradient(135deg,#ffffff 0%,#ff8a95 50%,#ffffff 100%);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
        }
        .badge{
            display:inline-block;margin-top:8px;padding:6px 14px;
            background:rgba(255,77,90,0.1);border:1px solid rgba(255,77,90,0.25);
            border-radius:20px;font-size:0.75rem;font-weight:700;color:var(--accent);
            text-transform:uppercase;letter-spacing:1px;
        }

        .card{
            background:var(--card);backdrop-filter:blur(24px);
            border-radius:20px;padding:22px;border:1px solid var(--border);
            margin-bottom:14px;position:relative;box-shadow:0 8px 32px rgba(0,0,0,0.3);
        }

        .api-status{
            display:flex;align-items:center;gap:10px;font-size:0.7rem;font-weight:700;
            letter-spacing:1px;text-transform:uppercase;margin-bottom:20px;
            padding:10px 14px;border-radius:12px;
            background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);
        }
        .api-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green-glow);}

        .league-pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
        .league-pill{
            padding:8px 14px;border-radius:20px;border:1px solid var(--border);
            background:var(--glass-bg);color:var(--muted);font-size:0.75rem;
            font-weight:700;cursor:pointer;transition:0.25s;display:flex;align-items:center;gap:6px;
        }
        .league-pill:hover, .league-pill.active{
            border-color:var(--accent);color:var(--text);
            background:rgba(255,77,90,0.1);box-shadow:0 4px 15px rgba(255,77,90,0.2);
        }

        .vs-divider{text-align:center;color:var(--muted);font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:4px;margin:10px 0;}

        label{display:block;margin-bottom:8px;color:var(--muted);font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;}
        select{
            width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);
            background:rgba(255,255,255,0.03);color:var(--text);font-family:'DM Sans',sans-serif;
            font-size:0.9rem;appearance:none;cursor:pointer;
        }

        .calc-btn{
            width:100%;padding:18px;border-radius:16px;border:none;
            background:linear-gradient(135deg,var(--accent),#ff6b7a);
            color:white;font-family:'Bebas Neue',sans-serif;font-size:1.4rem;
            letter-spacing:2px;margin-top:20px;cursor:pointer;
            box-shadow:0 8px 25px rgba(255,77,90,0.3);transition:0.3s;
        }
        .calc-btn:active{transform:scale(0.98);}

        /* Resultados */
        .res-container{margin-top:15px;}
        .res-card{background:var(--card2);border-radius:18px;padding:20px;border:1px solid var(--border);margin-bottom:10px;}
        .res-title{font-size:0.8rem;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:12px;text-transform:uppercase;}
        .prob-row{display:flex;justify-content:space-between;margin:10px 0;font-size:1rem;}
        .prob-val{font-weight:700;color:var(--green);}
        .hidden{display:none;}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">FOOTBALL<span>BET</span></div>
        <div class="badge">⚡ MOTOR AVANZADO · V2.1</div>
    </div>

    <div class="card">
        <div class="api-status">
            <div class="api-dot"></div>
            <span>CONECTADO: TEMPORADA 2025/2026</span>
        </div>

        <label>LIGA / COMPETENCIA</label>
        <div class="league-pills" id="league-pills"></div>

        <div class="vs-divider">VS</div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <div>
                <label>🏠 LOCAL</label>
                <select id="home-team" disabled><option>Elige liga...</option></select>
            </div>
            <div>
                <label>✈️ VISITANTE</label>
                <select id="away-team" disabled><option>Elige liga...</option></select>
            </div>
        </div>

        <button class="calc-btn" id="calc-btn">CALCULAR PROBABILIDADES</button>
    </div>

    <div id="results-area" class="hidden res-container">
        <div class="res-card" id="output-data"></div>
    </div>
</div>

<script>
// --- DATOS DE EQUIPOS ACTUALIZADOS ---
const LIGAS = {
    "PD": {
        name: "🇪🇸 La Liga", avg: 9.5,
        teams: ["Alavés","Athletic Club","Atlético de Madrid","FC Barcelona","Real Betis","Celta de Vigo","Elche CF","Espanyol","Getafe CF","Girona FC","Levante UD","Mallorca","Osasuna","Rayo Vallecano","Real Madrid CF","Real Oviedo","Real Sociedad","Sevilla FC","Valencia CF","Villarreal CF"]
    },
    "SA": {
        name: "🇮🇹 Serie A", avg: 9.0,
        teams: ["AC Milan","AS Roma","Atalanta","Bolonia","Cagliari","Como","Cremonese","Fiorentina","Génova","Hellas Verona","Internazionale","Juventus","Lazio","Lecce","Napoli","Parma","Pisa","Sassuolo","Torino","Udinese"]
    },
    "PL": {
        name: "🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League", avg: 10.1,
        teams: ["Arsenal FC","Aston Villa FC","Bournemouth","Brentford","Brighton","Chelsea FC","Crystal Palace","Everton","Fulham","Ipswich Town","Leicester City","Liverpool FC","Manchester City","Manchester Utd","Newcastle Utd","Nottm Forest","Southampton","Tottenham","West Ham","Wolves"]
    },
    "BL1": { name: "🇩🇪 Bundesliga", avg: 9.8, teams: ["Bayern München","Borussia Dortmund","Bayer Leverkusen","RB Leipzig","Stuttgart"] },
    "FL1": { name: "🇫🇷 Ligue 1", avg: 9.3, teams: ["Paris SG","Marseille","Monaco","Lille","RC Lens","FC Nantes","Lyon","Rennes"] },
    "BSA": { name: "🇧🇷 Brasileirão", avg: 9.4, teams: ["Flamengo","Palmeiras","Botafogo","São Paulo","Corinthians","Internacional"] },
    "MXL": { name: "🇲🇽 Liga MX", avg: 8.5, teams: ["América","Cruz Azul","Tigres","Monterrey","Chivas","Pumas"] },
    "LIB": { name: "🏆 Libertadores", avg: 9.2, teams: ["River Plate","Boca Juniors","Flamengo","Palmeiras","Bolívar","Peñarol"] }
};

let currentLeague = null;

// --- LÓGICA DE INTERFAZ ---
document.addEventListener('DOMContentLoaded', () => {
    const pContainer = document.getElementById('league-pills');
    const hSel = document.getElementById('home-team');
    const aSel = document.getElementById('away-team');
    const btn = document.getElementById('calc-btn');

    Object.keys(LIGAS).forEach(key => {
        const p = document.createElement('div');
        p.className = 'league-pill';
        p.innerHTML = `<span>${LIGAS[key].name}</span>`;
        p.onclick = () => {
            document.querySelectorAll('.league-pill').forEach(x => x.classList.remove('active'));
            p.classList.add('active');
            currentLeague = key;
            updateTeams(key);
        };
        pContainer.appendChild(p);
    });

    function updateTeams(key) {
        [hSel, aSel].forEach(s => {
            s.innerHTML = '<option value="">Seleccionar equipo...</option>';
            LIGAS[key].teams.sort().forEach(t => {
                const o = document.createElement('option');
                o.value = t; o.textContent = t;
                s.appendChild(o);
            });
            s.disabled = false;
        });
    }

    btn.onclick = () => {
        if(!hSel.value || !aSel.value) { alert("Elige ambos equipos"); return; }
        showResults(hSel.value, aSel.value);
    };
});

// --- MOTOR DE CÁLCULO ---
function factorial(n) { return n<=1 ? 1 : n * factorial(n-1); }
function poisson(l, k) { return (Math.pow(l, k) * Math.exp(-l)) / factorial(k); }

function showResults(h, v) {
    const resArea = document.getElementById('results-area');
    const out = document.getElementById('output-data');
    resArea.classList.remove('hidden');

    let lHome = 1.6, lAway = 1.2; // Simulación Dixon-Coles
    let winH = 0, draw = 0, winV = 0;

    for(let i=0; i<6; i++) {
        for(let j=0; j<6; j++) {
            let p = poisson(lHome, i) * poisson(lAway, j);
            if(i > j) winH += p;
            else if(i === j) draw += p;
            else winV += p;
        }
    }

    const cornAvg = LIGAS[currentLeague].avg;
    const over8 = 0.68; // Estimación basada en promedio liga

    out.innerHTML = `
        <div style="text-align:center; font-weight:700; margin-bottom:15px; color:white;">${h} vs ${v}</div>
        
        <div class="res-title">Probabilidades 1X2</div>
        <div class="prob-row"><span>Victoria ${h}</span><span class="prob-val">${(winH*100).toFixed(1)}%</span></div>
        <div class="prob-row"><span>Empate</span><span class="prob-val">${(draw*100).toFixed(1)}%</span></div>
        <div class="prob-row"><span>Victoria ${v}</span><span class="prob-val">${(winV*100).toFixed(1)}%</span></div>

        <div class="res-title" style="margin-top:20px;">Córners (Media: ${cornAvg})</div>
        <div class="prob-row"><span>Más de 8.5 Córners</span><span class="prob-val">${(over8*100).toFixed(0)}%</span></div>
        <div class="prob-row"><span>Menos de 8.5 Córners</span><span class="prob-val">${((1-over8)*100).toFixed(0)}%</span></div>
    `;
}
</script>
</body>
</html>
