<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictor Pro BSD - Conexión Total</title>
    <style>
        :root { --bg: #050810; --card: #111827; --accent: #00f2ff; --success: #10b981; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; }
        .container { width: 100%; max-width: 450px; margin: auto; }
        .header { text-align: center; padding: 20px; background: rgba(0,242,255,0.05); border-radius: 20px; margin-bottom: 20px; border: 1px solid rgba(0,242,255,0.1); }
        .main-button { width: 100%; padding: 18px; background: var(--accent); color: var(--bg); border: none; border-radius: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 0 20px rgba(0,242,255,0.2); }
        .match-card { background: var(--card); border-radius: 18px; padding: 18px; margin-bottom: 15px; border: 1px solid #1f2937; }
        .teams { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem; margin: 10px 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background: rgba(255,255,255,0.02); padding: 10px; border-radius: 12px; text-align: center; }
        .stat-label { font-size: 0.6rem; color: #9ca3af; display: block; }
        .real-prob { font-size: 0.9rem; color: var(--success); font-weight: bold; }
        .recommendation { grid-column: span 2; margin-top: 10px; padding: 10px; border-radius: 10px; text-align: center; font-weight: bold; background: rgba(16,185,129,0.1); color: #34d399; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0; font-size: 1.4rem;">📊 PREDICTOR PRO</h1>
        <p style="margin:5px 0 0; font-size:0.8rem; color:var(--accent);">IA Deportiva | Lógica de Poisson</p>
    </div>

    <button class="main-button" id="btn" onclick="llamarAPI()">⚡ ANALIZAR PARTIDOS REALES</button>
    <div id="status" style="text-align:center; font-size:0.8rem; margin:15px; color:#6b7280;"></div>
    <div id="results"></div>
</div>

<script>
    const TOKEN = 'D1c591c865f3f9dd0d9f8d60337c895a94c4683e';
    // Usamos un proxy para evitar el error de conexión
    const PROXY = "https://api.allorigins.win/get?url=";
    const API_URL = encodeURIComponent(`https://sports.bzzoiro.com/api/fixtures?token=${TOKEN}`);

    function poisson(media, x) {
        const e = 2.71828;
        let fact = 1;
        for (let i = 1; i <= x; i++) fact *= i;
        return (Math.pow(media, x) * Math.pow(e, -media)) / fact;
    }

    async function llamarAPI() {
        const status = document.getElementById('status');
        const results = document.getElementById('results');
        results.innerHTML = '';
        status.innerHTML = "Conectando con el servidor seguro...";

        try {
            const res = await fetch(`${PROXY}${API_URL}`);
            const json = await res.json();
            // AllOrigins devuelve la respuesta dentro de .contents como string
            const data = JSON.parse(json.contents);
            const matches = data.data || [];

            if (matches.length === 0) {
                status.innerHTML = "⚠️ No hay partidos en este momento.";
                return;
            }

            status.innerHTML = `✅ ${matches.length} partidos encontrados.`;
            
            matches.forEach(m => {
                // Cálculo de Poisson (estimado sobre 2.5 goles promedio)
                const probHT = Math.floor((1 - poisson(2.5, 0)) * 88);
                
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `
                    <span style="font-size:0.6rem; color:#64748b; text-transform:uppercase;">${m.league_name}</span>
                    <div class="teams"><span>${m.home_name}</span> <span>vs</span> <span>${m.away_name}</span></div>
                    <div class="grid">
                        <div class="stat-box"><span class="stat-label">+0.5 HT</span><span class="real-prob">${probHT}%</span></div>
                        <div class="stat-box"><span class="stat-label">+1.5 FINAL</span><span class="real-prob">${probHT + 10}%</span></div>
                        <div class="stat-box"><span class="stat-label">BTTS</span><span class="real-prob">${Math.floor(probHT * 0.9)}%</span></div>
                        <div class="stat-box"><span class="stat-label">CÓRNERS</span><span class="real-prob">9.5</span></div>
                        <div class="recommendation">🎯 RECO: Entrada Confirmada +0.5 HT</div>
                    </div>
                `;
                results.appendChild(card);
            });

        } catch (e) {
            status.innerHTML = "❌ Error al leer datos. Intenta nuevamente.";
            console.error(e);
        }
    }
</script>
</body>
</html>
