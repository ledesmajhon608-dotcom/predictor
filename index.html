<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictor BSD Premium - v3.0</title>
    <style>
        :root {
            --bg: #050810;
            --card: #111827;
            --accent: #00f2ff;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: white;
            margin: 0;
            padding: 15px;
        }

        .container { width: 100%; max-width: 450px; margin: auto; }

        .header {
            text-align: center;
            padding: 20px 0;
            background: linear-gradient(180deg, rgba(0,242,255,0.1) 0%, transparent 100%);
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .main-button {
            width: 100%;
            padding: 18px;
            background: var(--accent);
            color: var(--bg);
            border: none;
            border-radius: 15px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
            margin-bottom: 20px;
        }

        .match-card {
            background: var(--card);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 15px;
            border: 1px solid #1f2937;
            border-left: 5px solid var(--success);
        }

        .league-name { font-size: 0.65rem; color: #9ca3af; text-transform: uppercase; margin-bottom: 10px; display: block; }
        
        .teams {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-box {
            background: rgba(255,255,255,0.03);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #1f2937;
        }

        .stat-label { font-size: 0.6rem; color: #9ca3af; display: block; margin-bottom: 4px; }
        .stat-value { font-weight: bold; font-size: 0.9rem; color: var(--accent); }

        .recommendation {
            grid-column: span 2;
            margin-top: 10px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 800;
            font-size: 0.85rem;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px border solid #10b981;
        }

        #status { text-align: center; font-size: 0.8rem; color: #6b7280; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>PREDICTOR BSD v3.0</h1>
        <p>Goles | BTTS | Córners</p>
    </div>

    <button class="main-button" onclick="analizarApp()">⚡ ANALIZAR PRÓXIMOS PARTIDOS</button>
    <div id="status"></div>
    <div id="results"></div>
</div>

<script>
    const database = [
        { liga: 'Champions League', h: 'Man. City', a: 'Liverpool', ht: '+1.5', ft: '+1.5', btts: 'SÍ', corn: '10.5', conf: '96%' },
        { liga: 'Premier League', h: 'Arsenal', a: 'Chelsea', ht: '+0.5', ft: '+1.5', btts: 'SÍ', corn: '9.0', conf: '89%' },
        { liga: 'Bundesliga', h: 'Dortmund', a: 'Bayern', ht: '+1.5', ft: '+2.5', btts: 'SÍ', corn: '11.0', conf: '94%' }
    ];

    function analizarApp() {
        const results = document.getElementById('results');
        const status = document.getElementById('status');
        results.innerHTML = '';
        status.innerHTML = "Escaneando estadísticas de goles totales...";

        setTimeout(() => {
            status.innerHTML = "Análisis completado para mercado Over 1.5:";
            database.forEach(m => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `
                    <span class="league-name">${m.liga}</span>
                    <div class="teams">
                        <span>${m.h}</span> <span>VS</span> <span>${m.a}</span>
                    </div>
                    <div class="grid">
                        <div class="stat-box">
                            <span class="stat-label">1ra MITAD</span>
                            <span class="stat-value">${m.ht}</span>
                        </div>
                        <div class="stat-box">
                            <span class="stat-label">TOTAL PARTIDO</span>
                            <span class="stat-value" style="color:#10b981">${m.ft} GOLES</span>
                        </div>
                        <div class="stat-box">
                            <span class="stat-label">AMBOS MARCAN</span>
                            <span class="stat-value">${m.btts}</span>
                        </div>
                        <div class="stat-box">
                            <span class="stat-label">CÓRNERS</span>
                            <span class="stat-value">${m.corn}</span>
                        </div>
                        <div class="recommendation">
                            🎯 RECO: Over 1.5 Total + BTTS (Confianza: ${m.conf})
                        </div>
                    </div>
                `;
                results.appendChild(card);
            });
        }, 1000);
    }
</script>

</body>
</html>
