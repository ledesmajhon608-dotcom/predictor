        .header>*{position:relative;z-index:1;}
        .logo{font-family:'Bebas Neue',sans-serif;font-size:3rem;letter-spacing:4px;color:white;line-height:1;text-shadow:0 0 30px var(--accent-glow),0 2px 4px rgba(0,0,0,0.5);background:linear-gradient(135deg,#ffffff 0%,#ff8a95 50%,#ffffff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

        .card{background:var(--card);backdrop-filter:blur(24px);border-radius:20px;padding:22px;border:1px solid var(--border);margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.3);transition:all 0.3s ease;}

        .card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--yellow),var(--green),transparent);opacity:0.7;}

        .api-status{display:flex;align-items:center;gap:10px;font-size:0.66rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(10px);}

        .api-dot.live{background:var(--green);box-shadow:0 0 10px var(--green-glow),0 0 20px var(--green-glow);}

        label{display:block;margin:14px 0 5px;color:var(--muted);font-size:0.66rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}

        select:disabled{opacity:0.4;cursor:not-allowed;}
        .team-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

        .vs-divider{display:flex;align-items:center;justify-content:center;margin:6px 0;color:var(--muted);font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:3px;gap:12px;}

        .markets-label{display:block;margin:14px 0 8px;color:var(--muted);font-size:0.66rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}

        .mkt-toggle{padding:6px 12px;border-radius:16px;border:1px solid var(--border);background:var(--glass-bg);color:var(--muted);font-size:0.7rem;font-weight:700;cursor:pointer;transition:all 0.25s ease;letter-spacing:0.5px;backdrop-filter:blur(10px);}

        .calc-btn:active{transform:scale(0.97);}

        .form-row{display:flex;gap:3px;justify-content:center;margin-top:4px;}
        .form-dot{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:0.55rem;font-weight:700;backdrop-filter:blur(5px);}

        .form-dot.d{background:rgba(255,182,39,0.25);color:var(--yellow);box-shadow:0 0 6px rgba(255,182,39,0.2);}

        .result-boxes{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:16px;}
        .result-box{background:var(--glass-bg);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center;backdrop-filter:blur(15px);transition:all 0.3s ease;}

        .result-box.rb-center{border-color:rgba(255,182,39,0.3);background:rgba(255,182,39,0.05);min-width:80px;}
        .rb-label{font-size:0.62rem;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
        .rb-pct{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:1px;line-height:1;}
        .section-header{display:flex;align-items:center;gap:10px;margin:18px 0 10px;}
        .section-icon{font-size:1.1rem;}
        .section-title{font-family:'Bebas Neue',sans-serif;font-size:0.95rem;letter-spacing:2px;color:var(--text);}
        .section-lambda{margin-left:auto;font-family:'Bebas Neue',sans-serif;font-size:0.85rem;letter-spacing:1px;color:var(--muted);}

        .rc-label{font-size:0.62rem;color:var(--muted);font-weight:700;letter-spacing:1px;}
        .disclaimer{text-align:center;color:var(--muted);font-size:0.63rem;margin-top:20px;line-height:1.6;opacity:0.6;}
        .hidden{display:none;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
        .animate-in{animation:fadeUp 0.5s ease-out forwards;}
        @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.7;}}
        .pulse{animation:pulse 2s ease-in-out infinite;}
    </style>
</head>

// Funciones auxiliares
function normalizeTeamName(s) {
    return s.trim().toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/\b(fc|cf|sc|ac|as|ss|rc|rb|kv|krc|kaa|afc|rcd|ud|ca|oh|sv|vfl|vfb|fsv|tsg|rkc|pec|nec|ssc|acf|cd|og|aj|sl|ae|bv|sv|bayer|borussia|atletico|olympique|deportivo|real|club|sporting|sport)\b/gi, '')
        .replace(/[^a-z0-9\s]/g, '')
        .replace(/\s+/g, ' ').trim();
}

let currentLeagueKey=null,teamMap={},apiAvailable=false;

const teamSeasonStatsCache = {};

// CORRECCIÓN: Función para llenar selects (siempre funciona)
function fillSelects(teamsList, teamsMeta) {
    const hSel=document.getElementById('home-team');
    const aSel=document.getElementById('away-team');
    
    // Limpiar
    hSel.innerHTML = '';
    aSel.innerHTML = '';
    
    // Opción por defecto
    const defaultOpt = new Option('— Seleccionar —', '');
    hSel.add(defaultOpt);
    aSel.add(defaultOpt.cloneNode(true));
    
    if (!teamsList || teamsList.length === 0) {
        hSel.disabled = true;
        aSel.disabled = true;
        return;
    }
    
    // Ordenar y agregar
    const sorted = [...teamsList].sort((a,b) => a.localeCompare(b));
    sorted.forEach(name => {
        const opt = new Option(name, name);
        if (teamsMeta && teamsMeta[name]) {
            opt.dataset.bsdId = teamsMeta[name].bsdId || '';
            opt.dataset.offlineName = teamsMeta[name].offlineName || name;
        }
        hSel.add(opt.cloneNode(true));
        aSel.add(opt.cloneNode(true));
    });
    
    hSel.disabled = false;
    aSel.disabled = false;
}

// CORRECCIÓN: Carga de equipos simplificada
async function loadTeams(key) {
    const liga = LIGAS[key];
    if (!liga) return;
    
    // Reset
    teamMap = {};
    Object.keys(statsCache).forEach(k => delete statsCache[k]);
    
    // Verificar si hay API
    if (apiAvailable && bsdLeagueMap[key]) {
        try {
            setApiStatus('live', '🟢 Cargando equipos desde API...');
            
            // Obtener equipos de la API
            let apiTeams = [];
            try {
                const data = await bsdFetch('/teams/?league=' + bsdLeagueMap[key].bsdId + '&page_size=200');
                apiTeams = data.results || [];
            } catch(e) {
                console.warn('Fallo league ID, intentando season:', e);
            }
            
            if (apiTeams.length < 6) {
                try {
                    const data = await bsdFetch('/teams/?season=' + bsdLeagueMap[key].seasonId + '&page_size=200');
                    const extra = data.results || [];
                    const exist = new Set(apiTeams.map(t => t.id));
                    extra.forEach(t => { if (!exist.has(t.id)) apiTeams.push(t); });
                } catch(e) {}
            }
            
            // Si todavía hay pocos, extraer de eventos
            if (apiTeams.length < 6) {
                try {
                    const events = await bsdFetchAll('/events/?season=' + bsdLeagueMap[key].seasonId + '&limit=100');
                    const tMap = new Map();
                    events.forEach(ev => {
                        if (ev.home_team_obj?.id) tMap.set(ev.home_team_obj.id, ev.home_team_obj);
                        if (ev.away_team_obj?.id) tMap.set(ev.away_team_obj.id, ev.away_team_obj);
                    });
                    const fromEv = [...tMap.values()];
                    const exist = new Set(apiTeams.map(t => t.id));
                    fromEv.forEach(t => { if (!exist.has(t.id)) apiTeams.push(t); });
                } catch(e) {}
            }
            
            // Diferentes estrategias para llenar
            if (apiTeams.length >= 4) {
                // Usar nombres de API
                const teams = apiTeams.map(t => t.name).filter(n => n && n.trim());
                const meta = {};
                teams.forEach(name => {
                    const apiTeam = apiTeams.find(t => t.name === name);
                    if (apiTeam) {
                        meta[name] = { bsdId: apiTeam.id, offlineName: name };
                        teamMap[name] = { bsdId: apiTeam.id, offlineName: name };
                    }
                });
                
                if (teams.length > 0) {
                    fillSelects(teams, meta);
                    setApiStatus('live', `🟢 BSD — ${teams.length} equipos cargados`);
                    return;
                }
            }
            
        } catch(e) {
            console.error('Error cargando equipos API:', e);
        }
    }
    
    // Fallback: usar lista offline
    setApiStatus('error', '🟡 Equipos offline');
    const teams = liga.teams || [];
    const meta = {};
    teams.forEach(name => {
        meta[name] = { bsdId: '', offlineName: name };
        teamMap[name] = { bsdId: '', offlineName: name };
    });
    fillSelects(teams, meta);
}

async function bsdFetch(path,timeoutMs=API_TIMEOUT){
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), timeoutMs);
    try {
        const res = await fetch(`${BSD_BASE}${path}`, {
            headers: {'Authorization': `Token ${BSD_TOKEN}`},
            signal: controller.signal
        });
        clearTimeout(timeout);
        if (!res.ok) throw new Error(`BSD ${res.status}`);
        return res.json();
    } catch(e) {
        clearTimeout(timeout);
        throw e;
    }
}

async function bsdFetchAll(path,timeoutMs=API_TIMEOUT){
    let results=[],url=`${BSD_BASE}${path}`,pageCount=0;
    while(url&&pageCount<5){
        try{
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), timeoutMs);
            const res = await fetch(url, {
                headers: {'Authorization': `Token ${BSD_TOKEN}`},
                signal: controller.signal
            });
            clearTimeout(timeout);
            if(!res.ok)break;
            const data=await res.json();
            results=results.concat(data.results||[]);
            url=data.next||null;
            pageCount++;
            if(results.length>=200)break;
        }catch(e){break;}
    }
    return results;
}

function setApiStatus(state,text){
    document.getElementById('api-dot').className=`api-dot ${state}`;
    document.getElementById('api-status-text').textContent=text;
}

function renderLeaguePills(){
    const container=document.getElementById('league-pills');
    container.innerHTML='';
    for(const[key,liga]of Object.entries(LIGAS)){
        const pill=document.createElement('button');
        pill.className='league-pill';
        pill.textContent=liga.name;
        pill.dataset.key=key;
        pill.onclick=()=>selectLeague(key);
        container.appendChild(pill);
    }
}

function renderMarketToggles(){
    const container=document.getElementById('market-toggles');
    const defs=[
        {key:'ht',label:'⏱ Goles HT'},
        {key:'goles',label:'⚽ Goles +1.5/2.5'},
        {key:'btts',label:'🤝 BTTS'},
        {key:'corn',label:'⬡ Córners'}
    ];
    container.innerHTML='';
    const liga=currentLeagueKey?LIGAS[currentLeagueKey]:null;
    defs.forEach(d=>{
        const btn=document.createElement('button');
        btn.className='mkt-toggle';
        btn.textContent=d.label;
        btn.dataset.key=d.key;
        const available=!liga||(liga.markets[d.key]===true);
        if(!available){
            btn.classList.add('unavailable');
            activeMarkets[d.key]=false;
        }else{
            if(activeMarkets[d.key])btn.classList.add('on');
            btn.onclick=()=>{
                activeMarkets[d.key]=!activeMarkets[d.key];
                btn.classList.toggle('on');
            };
        }
        container.appendChild(btn);
    });
}

function selectLeague(key){
    if(currentLeagueKey===key)return;
    currentLeagueKey=key;
    document.querySelectorAll('.league-pill').forEach(p=>p.classList.toggle('active',p.dataset.key===key));
    const liga=LIGAS[key];
    activeMarkets={ht:liga.markets.ht,goles:liga.markets.goles,btts:liga.markets.btts,corn:liga.markets.corn};
    renderMarketToggles();
    loadTeams(key);
    document.getElementById('results').classList.add('hidden');
}

function matchLeagueName(bsdLeagueName,ligaKey){
    const liga=LIGAS[ligaKey];
    if(!liga)return false;
    const norm=s=>s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
    const bsdNorm=norm(bsdLeagueName);
    if(bsdNorm===norm(liga.bsdName))return true;
    if(liga.bsdNameAlt){
        for(const alt of liga.bsdNameAlt){
            if(bsdNorm===norm(alt))return true;
        }
    }
    const mainWords=norm(liga.bsdName).split(' ');
    if(mainWords.every(word=>bsdNorm.includes(word)))return true;
    return false;
}

// CORRECCIÓN: Inicialización simplificada
window.onload=async()=>{
    renderLeaguePills();
    renderMarketToggles();
    setApiStatus('error','🟡 Conectando con BSD API...');
    
    try{
        let allLeagues=[],url=BSD_BASE+'/leagues/?page_size=100',pageCount=0;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);
        
        while(url&&pageCount<5){
            const res=await fetch(url,{
                headers:{'Authorization':'Token '+BSD_TOKEN},
                signal: controller.signal
            });
            if(!res.ok)throw new Error('BSD '+res.status);
            const data=await res.json();
            allLeagues=allLeagues.concat(data.results||[]);
            url=data.next||null;
            pageCount++;
        }
        clearTimeout(timeoutId);
        
        allLeagues.forEach(l=>{
            if(l.is_women)return;
            if(!l.current_season?.id)return;
            for(const code of Object.keys(LIGAS)){
                if(matchLeagueName(l.name,code)&&!bsdLeagueMap[code]){
                    bsdLeagueMap[code]={bsdId:l.id,seasonId:l.current_season.id};
                }
            }
        });
        
        const mapped=Object.keys(bsdLeagueMap).length;
        if(mapped>0){
            setApiStatus('live','🟢 BSD API — '+mapped+'/'+Object.keys(LIGAS).length+' ligas activas');
            apiAvailable=true;
            document.getElementById('engine-badge').textContent='🛰 BSD + Elo + Atk×Def + xG + Altitud · v2.1';
        } else {
            setApiStatus('error','🟡 Sin conexión — usando datos offline');
        }
    }catch(e){
        console.error('Error conectando a BSD:', e);
        setApiStatus('error','🟡 Sin conexión — usando datos offline');
    }
};
