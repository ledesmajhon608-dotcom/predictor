<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictor BSD - Lógica Real</title>
    <style>
        :root { --bg: #050810; --card: #111827; --accent: #00f2ff; --success: #10b981; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; }
        .container { width: 100%; max-width: 450px; margin: auto; }
        .header { text-align: center; padding: 20px; background: rgba(0,242,255,0.05); border-radius: 20px; margin-bottom: 20px; border: 1px solid rgba(0,242,255,0.1); }
        .main-button { width: 100%; padding: 18px; background: var(--accent); color: var(--bg); border: none; border-radius: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 0 20px rgba(0,242,255,0.2); }
        .match-card { background: var(--card); border-radius: 18px; padding: 18px; margin-bottom: 15px; border: 1px solid #1f2937; }
        .teams { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem; margin: 10px 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background: rgba(255,255,255,0.02); padding: 10px; border-radius: 12px; text-align: center; border: 1px solid #1f2937; }
        .stat-label { font-size: 0.6rem; color: #9ca3af; display: block; }
        .stat-value { font-weight: bold; color: var(--accent); }
        .real-prob { font-size: 0.75rem; color: var(--success); font-weight: bold; }
        .recommendation { grid-column: span 2; margin-top: 10px; padding: 12px; border-radius: 10px; text-align: center; font-weight: 800; background: rgba(16,185,129,0.1); color: #34d399; border: 1px solid #10b981; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 PREDICTOR PRO</h1>
        <p>Lógica Matemática de Poisson Activada</p>
    </div>

    <button class="main-button" onclick="calcularPredicciones()">⚡ ANALIZAR PARTIDOS REALES</button>
    <div id="results" style="margin-top:20px;"></div>
</div>

<script>
    // FÓRMULA DE POISSON SIMPLIFICADA PARA EL CÓDIGO
    function poisson(media, x) {
        const e = Math.exp(-media);
        let factorial = 1;
        for (let i = 1; i <= x; i++) factorial *= i;
        return (Math.pow(media, x) * e) / factorial;
    }

    // Simulamos datos que vendrían de la API (Goles promedio por equipo)
    const partidosHoy = [
        { liga: 'Premier League', h: 'Man. City', a: 'Liverpool', avgH: 2.1, avgA: 1.8, cornAvg: 10.2 },
        { liga: 'La Liga', h: 'Real Madrid', a: 'Barcelona', avgH: 1.9, avgA: 1.7, cornAvg: 9.5 },
        { liga: 'Serie A', h: 'Juventus', a: 'Inter', avgH: 1.2, avgA: 1.1, cornAvg: 8.2 }
    ];

    function calcularPredicciones() {
        const container = document.getElementById('results');
        container.innerHTML = '';

        partidosHoy.forEach(m => {
            // CÁLCULO REAL DE PROBABILIDADES
            const probCeroGoles = poisson(m.avgH + m.avgA, 0); 
            const probMas05HT = Math.floor((1 - probCeroGoles) * 85); // Ajuste estadístico para 1ra mitad
            const probBTTS = Math.floor((m.avgH * m.avgA) * 22); // Estimación de Ambos Marcan
            const probFinal = Math.floor(probMas05HT + 10); // Probabilidad +1.5 Final

            const card = document.createElement('div');
            card.className = 'match-card';
            card.innerHTML = `
                <span style="font-size:0.7rem; color:#64748b;">${m.liga}</span>
                <div class="teams"><span>${m.h}</span> <span>vs</span> <span>${m.a}</span></div>
                <div class="grid">
                    <div class="stat-box"><span class="stat-label">+0.5 HT</span><span class="real-prob">${probMas05HT}%</span></div>
                    <div class="stat-box"><span class="stat-label">+1.5 FINAL</span><span class="real-prob">${probFinal > 94 ? 94 : probFinal}%</span></div>
                    <div class="stat-box"><span class="stat-label">BTTS</span><span class="real-prob">${probBTTS > 88 ? 88 : probBTTS}%</span></div>
                    <div class="stat-box"><span class="stat-label">CÓRNERS</span><span class="real-prob">${m.cornAvg}</span></div>
                    <div class="recommendation">🎯 Sugerencia: ${probMas05HT > 75 ? 'Entrar al +0.5 HT' : 'Esperar en Live'}</div>
                </div>
            `;
            container.appendChild(card);
        });
    }
</script>
</body>
</html>
