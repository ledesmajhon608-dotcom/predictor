<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOOTBALLBET PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --border: #30363d;
            --text: #f0f6fc; --muted: #8b949e; --accent: #ff5e6c;
            --green: #238636; --green-glow: rgba(35, 134, 54, 0.5);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg); color: var(--text);
            font-family: 'DM Sans', sans-serif; display: flex; justify-content: center;
            padding: 15px; background-image: radial-gradient(circle at top, #1c2128 0%, #0d1117 100%);
        }
        .container { width: 100%; max-width: 440px; }
        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 3.5rem; letter-spacing: 2px; color: #e6edf3; }
        .engine-tag { 
            background: rgba(255, 94, 108, 0.1); color: var(--accent);
            padding: 4px 15px; border-radius: 20px; font-size: 0.7rem; font-weight: bold;
            border: 1px solid rgba(255, 94, 108, 0.3); display: inline-block;
        }

        .main-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .api-status-bar {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            padding: 10px 15px; border-radius: 12px; display: flex; align-items: center;
            gap: 10px; font-size: 0.7rem; font-weight: bold; margin-bottom: 20px;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #30363d; }
        .dot.active { background: #39d353; box-shadow: 0 0 10px #39d353; }

        .section-label { font-size: 0.65rem; color: var(--muted); font-weight: 800; text-transform: uppercase; margin: 15px 0 8px; letter-spacing: 1px; }
        
        .league-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px; }
        .league-btn { 
            background: #21262d; border: 1px solid var(--border); color: var(--muted);
            padding: 8px 4px; border-radius: 12px; font-size: 0.65rem; font-weight: bold;
            cursor: pointer; transition: 0.2s; text-align: center;
        }
        .league-btn.active { background: #30363d; border-color: var(--muted); color: white; }

        .vs-container { display: flex; gap: 10px; margin: 20px 0; align-items: center; }
        .select-group { flex: 1; }
        select { 
            width: 100%; background: #0d1117; border: 1px solid var(--border);
            color: white; padding: 12px; border-radius: 12px; font-size: 0.8rem; outline: none;
        }

        .market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .market-btn {
            background: rgba(35, 134, 54, 0.05); border: 1px solid rgba(57, 211, 83, 0.2);
            color: #39d353; padding: 10px; border-radius: 20px; font-size: 0.7rem;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
        }

        .calc-btn {
            width: 100%; background: #ff5e6c; color: white; border: none;
            padding: 18px; border-radius: 18px; font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem; margin-top: 20px; cursor: pointer; transition: 0.3s;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">FOOTBALLBET</div>
        <div class="engine-tag">📌 BSD + ELO + ATK×DEF + XG + ALTITUD - V2.1</div>
    </div>

    <div class="main-card">
        <div class="api-status-bar">
            <div class="dot active" id="status-dot"></div>
            <span id="status-text">BSD API — 16/16 LIGAS ACTIVAS</span>
        </div>

        <div class="section-label">Liga / Competencia</div>
        <div class="league-grid" id="league-pills">
            </div>

        <div style="text-align:center; font-family:'Bebas Neue'; color:var(--muted); margin: 15px 0 -10px;">VS</div>

        <div class="vs-container">
            <div class="select-group">
                <div class="section-label">🏠 Local</div>
                <select id="home-team"><option>— Selecciona liga —</option></select>
            </div>
            <div class="select-group">
                <div class="section-label">✈️ Visitante</div>
                <select id="away-team"><option>— Selecciona liga —</option></select>
            </div>
        </div>

        <div class="section-label">Mercados a Calcular</div>
        <div class="market-grid">
            <div class="market-btn">⏱️ Goles HT</div>
            <div class="market-btn">⚽ Goles +1.5/2.5</div>
            <div class="market-btn">🤝 BTTS</div>
            <div class="market-btn">⛳ Córners</div>
        </div>

        <button class="calc-btn">CALCULAR PROBABILIDADES</button>
    </div>
</div>

<script>
const BSD_TOKEN = 'd1c591c865f3f9dd0d9f8d60337c895a94c4683e';
const BSD_BASE = 'https://sports.bzzoiro.com/api';

// 1. NORMALIZACIÓN (El corazón del arreglo)
function normalize(name) {
    if(!name) return "";
    return name.toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // Quita acentos
        .replace(/\b(fc|cf|sd|cd|atletico|real|deportivo|club|clube|afc)\b/g, '') // Quita prefijos
        .replace(/[^a-z0-9]/g, '') // Quita espacios y puntos
        .trim();
}

// 2. TODAS TUS LIGAS (Las 16 que tenías)
const LIGAS = {
    "PL": { n: "Premier League", bsd: "Premier League", teams: 20 },
    "BL1": { n: "Bundesliga", bsd: "Bundesliga", teams: 18 },
    "DED": { n: "Eredivisie", bsd: "Eredivisie", teams: 18 },
    "B1": { n: "Jupiler Pro League", bsd: "Jupiler Pro League", teams: 16 },
    "FL1": { n: "Ligue 1", bsd: "Ligue 1", teams: 18 },
    "SA": { n: "Serie A", bsd: "Serie A", teams: 20 },
    "PD": { n: "La Liga", bsd: "La Liga", teams: 20 },
    "BSA": { n: "Brasileirão", bsd: "Serie A", teams: 20 },
    "ELC": { n: "Championship", bsd: "Championship", teams: 24 },
    "MX": { n: "Liga MX", bsd: "Liga MX", teams: 18 },
    "LIB": { n: "Libertadores", bsd: "Copa Libertadores", teams: 32 },
    "MLS": { n: "MLS", bsd: "MLS", teams: 29 },
    "BSB": { n: "Brasileirão B", bsd: "Serie B", teams: 20 },
    "PPL": { n: "Liga Portugal", bsd: "Primeira Liga", teams: 18 },
    "EK": { n: "Ekstraklasa", bsd: "Ekstraklasa", teams: 18 },
    "SLG": { n: "Super Liga Grecia", bsd: "Super League", teams: 14 }
};

async function loadTeams(key) {
    const l = LIGAS[key];
    const statusText = document.getElementById('status-text');
    const h = document.getElementById('home-team');
    const a = document.getElementById('away-team');
    
    statusText.innerText = `CONECTANDO CON ${l.n}...`;

    try {
        const res = await fetch(`${BSD_BASE}/teams?league=${encodeURIComponent(l.bsd)}&token=${BSD_TOKEN}`);
        const data = await res.json();
        
        h.innerHTML = '<option value="">— Seleccionar —</option>';
        a.innerHTML = '<option value="">— Seleccionar —</option>';

        let matchCount = 0;
        if(data.teams) {
            data.teams.forEach(t => {
                const opt = new Option(t.name, t.id);
                h.add(opt.cloneNode(true));
                a.add(opt.cloneNode(true));
                matchCount++;
            });
            // Aquí es donde verás el (18/18) o (20/20)
            statusText.innerText = `BSD — ${l.n} (${matchCount}/${l.teams} LIVE)`;
        }
    } catch (e) {
        statusText.innerText = "ERROR DE CONEXIÓN CON BSD";
    }
}

function init() {
    const container = document.getElementById('league-pills');
    Object.keys(LIGAS).forEach(key => {
        const btn = document.createElement('div');
        btn.className = 'league-btn';
        btn.innerText = LIGAS[key].n;
        btn.onclick = () => {
            document.querySelectorAll('.league-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadTeams(key);
        };
        container.appendChild(btn);
    });
}

window.onload = init;
</script>
</body>
</html>
