<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test API BSD</title></head>
<body>
  <h2>Probando API de sports.bzzoiro.com</h2>
  <p>Abre la consola (F12 → Consola) para ver los resultados.</p>
  <script>
    const API_KEY = 'd1c591c865f3f9dd0d9f8d60337c895a94c4683e';
    const BASE = 'https://sports.bzzoiro.com'; // Ajusta si es otra URL

    async function testEndpoint(endpoint) {
      try {
        const res = await fetch(`${BASE}${endpoint}`, {
          headers: { 'Authorization': `Bearer ${API_KEY}` } // o según la doc
        });
        const data = await res.json();
        console.log(`✅ ${endpoint}`, data);
        return data;
      } catch (err) {
        console.error(`❌ ${endpoint}`, err);
      }
    }

    (async () => {
      // Prueba varios endpoints comunes de estadísticas
      await testEndpoint('/api/v1/leagues');               // Lista de ligas
      await testEndpoint('/api/v1/teams/statistics?league=39&season=2025'); // Premier League (ID 39 suele ser EPL en algunas APIs)
      await testEndpoint('/api/v1/teams?league=39&season=2025'); // Equipos de una liga
      // Añade aquí más endpoints que veas en la documentación
      console.log('--- Pruebas completadas ---');
    })();
  </script>
</body>
</html>
