<script>
// ==========================================
// CONFIGURACIÓN DE ENDPOINTS DE LA API (REAL)
// ==========================================
const API_CONFIG = {
    baseUrl: 'https://api.bsdfootball.com/v1',
    token: 'REEMPLAZA_CON_TU_TOKEN_REAL', 
    useLiveApi: false 
};

const DIXON_COLES_RHO = -0.05;
let currentLeagueKey = 'PREMIER_LEAGUE';
const activeMarkets = { goles_ht: true, goles_full: true, btts: true, corners: true };

// =========================================================================
// LAS 16 LIGAS Y EQUIPOS COMPLETOS RESTAURADOS COMO RESPALDO AUTOMÁTICO
// =========================================================================
const LIGAS_FALLBACK = {
    'PREMIER_LEAGUE': { name: '🍇 Premier League', btts_factor: 1.05, mean_corners: 10.2, teams: ['Manchester City', 'Arsenal', 'Liverpool', 'Aston Villa', 'Tottenham', 'Chelsea', 'Manchester United', 'Newcastle'] },
    'BUNDESLIGA': { name: '🇩🇪 Bundesliga', btts_factor: 1.12, mean_corners: 9.8, teams: ['Bayer Leverkusen', 'Bayern Munich', 'VfB Stuttgart', 'RB Leipzig', 'Borussia Dortmund', 'Eintracht Frankfurt'] },
    'EREDIVISIE': { name: '🇳🇱 Eredivisie', btts_factor: 1.15, mean_corners: 10.1, teams: ['PSV Eindhoven', 'Feyenoord', 'Twente', 'AZ Alkmaar', 'Ajax Amsterdam'] },
    'JUPILER_LEAGUE': { name: '🇧🇪 Jupiler Pro League', btts_factor: 1.08, mean_corners: 9.9, teams: ['Club Brugge', 'Union SG', 'Anderlecht', 'Antwerp', 'KRC Genk'] },
    'LIGUE_1': { name: '🇫🇷 Ligue 1', btts_factor: 0.98, mean_corners: 9.3, teams: ['Paris Saint-Germain', 'AS Monaco', 'Lille OSC', 'Stade Brestois', 'OGC Nice', 'Olympique Marseille'] },
    'BRASILEIRAO': { name: '🇧🇷 Brasileirão', btts_factor: 0.96, mean_corners: 10.4, teams: ['Palmeiras', 'Flamengo', 'Atlético Mineiro', 'Botafogo', 'São Paulo', 'Fluminense'] },
    'CHAMPIONSHIP': { name: '🍇 Championship', btts_factor: 1.04, mean_corners: 10.5, teams: ['Leicester City', 'Ipswich Town', 'Leeds United', 'Southampton', 'West Brom'] },
    'LA_LIGA': { name: '🇪🇸 La Liga', btts_factor: 0.94, mean_corners: 9.1, teams: ['Real Madrid', 'Barcelona', 'Girona FC', 'Atlético Madrid', 'Athletic Bilbao', 'Real Sociedad'] },
    'SERIE_A': { name: '🇮🇹 Serie A', btts_factor: 0.97, mean_corners: 9.5, teams: ['Inter Milan', 'AC Milan', 'Juventus', 'Atalanta BC', 'Bologna FC 1909', 'AS Roma', 'SS Lazio'] },
    'LIGA_MX': { name: '🇲🇽 Liga MX', btts_factor: 1.06, mean_corners: 9.6, teams: ['Club América', 'Tigres UANL', 'Monterrey', 'CD Guadalajara', 'Cruz Azul', 'Pumas UNAM'] },
    'LIBERTADORES': { name: '🏆 Libertadores', btts_factor: 0.92, mean_corners: 9.7, teams: ['River Plate', 'Boca Juniors', 'Palmeiras', 'Flamengo', 'LDU Quito', 'Bolivar'] },
    'MLS': { name: '🇺🇸 MLS', btts_factor: 1.18, mean_corners: 10.3, teams: ['Inter Miami CF', 'Columbus Crew', 'LAFC', 'Los Angeles Galaxy', 'FC Cincinnati'] },
    'BRASILEIRAO_B': { name: '🇧🇷 Brasileirão B', btts_factor: 0.88, mean_corners: 9.9, teams: ['Santos FC', 'Goiás EC', 'Coritiba', 'América Mineiro', 'Sport Recife'] },
    'LIGA_PORTUGAL': { name: '🇵🇹 Liga Portugal', btts_factor: 1.02, mean_corners: 9.8, teams: ['Sporting CP', 'SL Benfica', 'FC Porto', 'SC Braga', 'Vitória Guimarães'] },
    'EKSTRAKLASA': { name: '🇵🇱 Ekstraklasa', btts_factor: 0.99, mean_corners: 9.6, teams: ['Jagiellonia', 'Śląsk Wrocław', 'Legia Warszawa', 'Lech Poznań', 'Raków'] },
    'GRECIA': { name: '🇬🇷 Super Liga Grecia', btts_factor: 0.95, mean_corners: 9.1, teams: ['PAOK Salonica', 'AEK Athens', 'Olympiacos FC', 'Panathinaikos', 'Aris'] }
};

// =========================================================================
// CONEXIONES ASÍNCRONAS REALES (FETCH)
// =========================================================================
async function checkApiConnection() {
    const indicator = document.getElementById('api-indicator');
    try {
        const response = await fetch(`${API_CONFIG.baseUrl}/status`, {
            method: 'GET',
            headers: { 'Authorization': `Bearer ${API_CONFIG.token}`, 'Content-Type': 'application/json' }
        });
        if (response.ok) {
            API_CONFIG.useLiveApi = true;
            indicator.className = "api-status connected";
            indicator.textContent = "🟢 BSD API V2.5 CONECTADA EN VIVO";
        } else { throw new Error(); }
    } catch (error) {
        API_CONFIG.useLiveApi = false;
        indicator.className = "api-status fallback";
        indicator.textContent = "⚠️ CONEXIÓN LOCAL ACTIVA (API EN ESPERA)";
    }
}

async function fetchTeamsForLeague(leagueKey) {
    if (!API_CONFIG.useLiveApi) {
        return LIGAS_FALLBACK[leagueKey]?.teams || [];
    }
    try {
        const response = await fetch(`${API_CONFIG.baseUrl}/teams?league=${leagueKey}`, {
            headers: { 'Authorization': `Bearer ${API_CONFIG.token}` }
        });
        const data = await response.json();
        return data.teams || data; 
    } catch (e) {
        return LIGAS_FALLBACK[leagueKey]?.teams || [];
    }
}

async function fetchTeamStatsFromApi(homeTeam, awayTeam) {
    let defaultStats = {
        home: { atk: 1.25, def: 0.80, elo: 1700, xgAtk: 1.30, xgDef: 0.75, cornerFor: 5.8, cornerAgainst: 4.1, altitud: 0 },
        away: { atk: 1.10, def: 0.90, elo: 1650, xgAtk: 1.15, xgDef: 0.85, cornerFor: 5.2, cornerAgainst: 4.5, altitud: 0 }
    };
    if (!API_CONFIG.useLiveApi) return defaultStats;
    try {
        const response = await fetch(`${API_CONFIG.baseUrl}/match-analysis?home=${encodeURIComponent(homeTeam)}&away=${encodeURIComponent(awayTeam)}`, {
            headers: { 'Authorization': `Bearer ${API_CONFIG.token}` }
        });
        return await response.json();
    } catch (err) { return defaultStats; }
}

// ==========================================
// MOTOR MATEMÁTICO DE PROBABILIDADES
// ==========================================
function calculateLambdas(stats, leagueKey) {
    const baseGoals = 1.35;
    let lambdaH = baseGoals * stats.home.xgAtk * stats.away.xgDef;
    let lambdaA = baseGoals * stats.away.xgAtk * stats.home.xgDef;
    
    const eloDiff = stats.home.elo - stats.away.elo;
    lambdaH *= (1 + eloDiff / 1300); lambdaA *= (1 - eloDiff / 1300);
    
    return {
        lambdaH: Math.max(0.1, lambdaH), lambdaA: Math.max(0.1, lambdaA),
        lambdaGoal: Math.max(0.05, (lambdaH + lambdaA) * 0.44),
        lambdaCorn: (stats.home.cornerFor + stats.away.cornerAgainst + stats.home.cornerAgainst + stats.away.cornerFor) / 2,
        negBinR: 6.5
    };
}

function factorial(n) { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }
function poissonProb(k, lambda) { return (Math.pow(lambda, k) * Math.exp(-lambda)) / factorial(k); }
function poissonOver(lambda, line) {
    let pUnder = 0; for (let k = 0; k <= Math.floor(line); k++) pUnder += poissonProb(k, lambda);
    return Math.max(0, Math.min(100, (1 - pUnder) * 100));
}
function nCr(n, r) { if (r < 0 || r > n) return 0; return factorial(n) / (factorial(r) * factorial(n - r)); }
function negBinOver(lambda, line, r) {
    let pUnder = 0; const p = r / (r + lambda);
    for (let k = 0; k <= Math.floor(line); k++) pUnder += nCr(k + r - 1, k) * Math.pow(p, r) * Math.pow(1 - p, k);
    return Math.max(0, Math.min(100, (1 - pUnder) * 100));
}
function plattCalibrate(rawProb, type) {
    let a = -0.05, b = 2.5;
    if(type === 'goals') { a = -0.06; b = 2.8; }
    else if(type === 'corners') { a = -0.07; b = 3.1; }
    return Math.max(1, Math.min(99, (1 / (1 + Math.exp(a * rawProb + b))) * 100));
}

function calcResultProbs(lH, lA) {
    let h = 0, d = 0, a = 0;
    for (let x = 0; x <= 7; x++) {
        for (let y = 0; y <= 7; y++) {
            let p = poissonProb(x, lH) * poissonProb(y, lA);
            if (x === 0 && y === 0) p *= (1 - lH * lA * DIXON_COLES_RHO);
            if (x > y) h += p; else if (x === y) d += p; else a += p;
        }
    }
    const t = h + d + a || 1; return { home: (h/t)*100, draw: (d/t)*100, away: (a/t)*100 };
}

// RENDERIZADO VISUAL RECTILÍNEO
function buildRow(label, rawProb, type) {
    const calibrated = plattCalibrate(rawProb, type);
    const colorClass = calibrated >= 70 ? 'green' : calibrated >= 52 ? 'yellow' : 'accent';
    return `
        <div class="row-market">
            <div class="row-meta"><span class="line-text">${label}</span><span class="prob-text">${calibrated.toFixed(0)}%</span></div>
            <div class="progress-container"><div class="progress-bar ${colorClass}" style="width: ${calibrated}%"></div></div>
        </div>`;
}

async function processAndRenderUI() {
    const home = document.getElementById('select-home').value;
    const away = document.getElementById('select-away').value;
    
    const dataMetrics = await fetchTeamStatsFromApi(home, away);
    const lambdas = calculateLambdas(dataMetrics, currentLeagueKey);
    
    const rp = calcResultProbs(lambdas.lambdaH, lambdas.lambdaA);
    document.getElementById('pct-1x2-home').textContent = plattCalibrate(rp.home, 'result').toFixed(1) + '%';
    document.getElementById('pct-1x2-draw').textContent = plattCalibrate(rp.draw, 'result').toFixed(1) + '%';
    document.getElementById('pct-1x2-away').textContent = plattCalibrate(rp.away, 'result').toFixed(1) + '%';
    document.getElementById('match-header-text').textContent = `${home} VS ${away}`;

    let html = ''; const recList = [];

    if (activeMarkets.goles_full) {
        const sumL = lambdas.lambdaH + lambdas.lambdaA;
        html += `
            <div class="market-block">
                <div class="block-header"><span class="block-title">⚽ Goles</span><span class="block-lambda">λ ${sumL.toFixed(2)}</span></div>
                ${buildRow('+1.5 Goles', poissonOver(sumL, 1.5), 'goals')}
                ${buildRow('+2.5 Goles', poissonOver(sumL, 2.5), 'goals')}
            </div>`;
        recList.push({ label: 'GOLES OVER 1.5', prob: plattCalibrate(poissonOver(sumL, 1.5), 'goals'), desc: 'Ataques proyectados eficientes.' });
    }

    if (activeMarkets.goles_ht) {
        html += `
            <div class="market-block">
                <div class="block-header"><span class="block-title">⏱️ Goles 1er Tiempo</span><span class="block-lambda">λ ${lambdas.lambdaGoal.toFixed(2)}</span></div>
                ${buildRow('+0.5 HT', poissonOver(lambdas.lambdaGoal, 0.5), 'goals')}
                ${buildRow('+1.5 HT', poissonOver(lambdas.lambdaGoal, 1.5), 'goals')}
            </div>`;
        recList.push({ label: 'GOL HT OVER 0.5', prob: plattCalibrate(poissonOver(lambdas.lambdaGoal, 0.5), 'goals'), desc: 'Presión inicial alta en el campo.' });
    }

    if (activeMarkets.btts) {
        const factor = LIGAS_FALLBACK[currentLeagueKey]?.btts_factor || 1.0;
        const rawBTTS = (1 - poissonProb(0, lambdas.lambdaH)) * (1 - poissonProb(0, lambdas.lambdaA)) * 100 * factor;
        html += `
            <div class="market-block">
                <div class="block-header"><span class="block-title">🤝 Ambos Marcan</span></div>
                ${buildRow('Ambos Marcan (Sí)', rawBTTS, 'btts')}
            </div>`;
        recList.push({ label: 'AMBOS MARCAN (SÍ)', prob: plattCalibrate(rawBTTS, 'btts'), desc: 'Estadísticas defensivas bajas en ambas escuadras.' });
    }

    if (activeMarkets.corners) {
        html += `
            <div class="market-block">
                <div class="block-header"><span class="block-title">📐 Córners</span><span class="block-lambda">λ ${lambdas.lambdaCorn.toFixed(1)}</span></div>
                ${buildRow('+7.5 Córners', negBinOver(lambdas.lambdaCorn, 7.5, lambdas.negBinR), 'corners')}
                ${buildRow('+8.5 Córners', negBinOver(lambdas.lambdaCorn, 8.5, lambdas.negBinR), 'corners')}
                ${buildRow('+9.5 Córners', negBinOver(lambdas.lambdaCorn, 9.5, lambdas.negBinR), 'corners')}
            </div>`;
        recList.push({ label: 'CÓRNERS OVER 7.5', prob: plattCalibrate(negBinOver(lambdas.lambdaCorn, 7.5, lambdas.negBinR), 'corners'), desc: 'Proyección táctica vertical amplia.' });
    }

    document.getElementById('blocks-container').innerHTML = html;

    recList.sort((a,b) => b.prob - a.prob);
    if(recList.length > 0) {
        const top = recList[0];
        const sub1 = recList[1] || { label: 'CÓRNERS OVER 7.5', prob: 64 };
        const sub2 = recList[2] || { label: 'GOL HT OVER 0.5', prob: 60 };
        
        document.getElementById('recommendation-box').innerHTML = `
            <div class="rec-card">
                <div class="rec-tag">⭐ MEJOR APUESTA</div>
                <div class="rec-value">${top.label}</div>
                <div class="rec-desc">${top.desc}</div>
                <div class="rec-badge-conf">${top.prob.toFixed(0)}% CONFIANZA ALTA</div>
                <div class="rec-secondary">
                    <div class="sec-title">🔎 OTRAS OPCIONES</div>
                    <div class="sec-row"><span>#2 ${sub1.label}</span><span>${sub1.prob.toFixed(0)}%</span></div>
                    <div class="sec-row"><span>#3 ${sub2.label}</span><span>${sub2.prob.toFixed(0)}%</span></div>
                </div>
            </div>`;
    }
    document.getElementById('output-dashboard').style.display = 'block';
}

// CONTROLADORES DE INTERFAZ
async function updateDropdowns() {
    const hSelect = document.getElementById('select-home');
    const aSelect = document.getElementById('select-away');
    hSelect.innerHTML = '<option>Cargando...</option>';
    aSelect.innerHTML = '<option>Cargando...</option>';
    
    const teamList = await fetchTeamsForLeague(currentLeagueKey);
    hSelect.innerHTML = ''; aSelect.innerHTML = '';
    
    teamList.forEach(t => {
        hSelect.insertAdjacentHTML('beforeend', `<option value="${t}">${t}</option>`);
        aSelect.insertAdjacentHTML('beforeend', `<option value="${t}">${t}</option>`);
    });
    if(aSelect.options[1]) aSelect.selectedIndex = 1;
}

function renderPills() {
    const container = document.getElementById('leagues-container');
    container.innerHTML = '';
    Object.keys(LIGAS_FALLBACK).forEach(k => {
        const active = k === currentLeagueKey ? 'active' : '';
        container.insertAdjacentHTML('beforeend', `<div class="league-pill ${active}" data-league="${k}">${LIGAS_FALLBACK[k].name}</div>`);
    });
    
    document.querySelectorAll('.league-pill').forEach(p => {
        p.addEventListener('click', async (e) => {
            document.querySelectorAll('.league-pill').forEach(x => x.classList.remove('active'));
            e.target.classList.add('active');
            currentLeagueKey = e.target.dataset.league;
            await updateDropdowns();
        });
    });
}

document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        const m = e.currentTarget.dataset.mkt;
        activeMarkets[m] = !activeMarkets[m];
        if(activeMarkets[m]) {
            e.currentTarget.classList.add('active');
            e.currentTarget.textContent = '🟢 ' + e.currentTarget.textContent.substring(2);
        } else {
            e.currentTarget.classList.remove('active');
            e.currentTarget.textContent = '🔴 ' + e.currentTarget.textContent.substring(2);
        }
    });
});

document.getElementById('btn-calc-trigger').addEventListener('click', processAndRenderUI);

window.onload = async () => {
    renderPills();
    await checkApiConnection();
    await updateDropdowns();
};
</script>
</body>
</html>
