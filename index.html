<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Prediction Engine Pro v2.5</title>
    <style>
        /* DISEÑO DE ALTA GAMA PARA TU DASHBOARD */
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --border-color: rgba(255, 255, 255, 0.08);
            --green: #2ecc71;
            --yellow: #ffb627;
            --accent: #ff4d5a;
            --muted: #8b949e;
            --text: #c9d1d9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        #engine-badge { 
            background: var(--card-bg); padding: 12px; border-radius: 8px; 
            border: 1px solid var(--border-color); font-size: 0.85rem; 
            font-weight: 600; text-align: center; margin-bottom: 20px; color: var(--yellow);
        }
        .section-header { display: flex; align-items: center; gap: 10px; margin: 25px 0 12px; font-weight: 700; font-size: 0.9rem; letter-spacing: 1px; color: #fff; }
        .section-lambda { font-size: 0.75rem; color: var(--muted); font-weight: normal; margin-left: auto; }
        .cal-badge { background: rgba(46,204,113,0.15); color: var(--green); padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        
        .recomendacion { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid rgba(46,204,113,0.3); margin-bottom: 20px; }
        .rec-title { font-size: 0.75rem; font-weight: 800; letter-spacing: 1.5px; margin-bottom: 6px; }
        .rec-main { font-size: 1.75rem; font-weight: 800; margin-bottom: 4px; }
        .rec-sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 12px; }
        .rec-confidence { display: inline-flex; align-items: center; gap: 8px; border: 1px solid currentColor; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        
        .mkt-grid { display: flex; flex-direction: column; gap: 8px; }
        .mkt-card { background: var(--card-bg); padding: 14px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .mkt-card-title { font-weight: 600; font-size: 0.9rem; color: #fff; }
        .mkt-card-prob { font-weight: 800; font-size: 1.1rem; color: var(--green); }
        
        .result-boxes { display: flex; gap: 12px; margin-top: 15px; }
        .result-box { flex: 1; background: var(--card-bg); padding: 15px; border-radius: 10px; text-align: center; border: 1px solid var(--border-color); }
        .rb-label { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
        .rb-pct { font-size: 1.5rem; font-weight: 800; margin-top: 6px; }
    </style>
</head>
<body>

    <div id="engine-badge">🔮 Cargando sistemas de predicción v2.5...</div>
    <div id="recomendacion-container"></div>
    <div id="all-markets-container"></div>
    <div id="result-boxes-container"></div>

<script>
// ==========================================
// CONFIGURACIÓN, CONSTANTES Y BASES DE DATOS
// ==========================================
const BSD_BASE = 'https://api.bsdfootball.com/v1'; 
const BSD_TOKEN = 'TU_TOKEN_AQUÍ'; 

const DIXON_COLES_RHO = -0.05; 
let currentLeagueKey = 'DEFAULT';
let apiAvailable = false;
const bsdLeagueMap = {};

const LIGAS = {
    'DEFAULT': { btts_factor: 1.0, mean_corners: 9.5 },
    'LA_LIGA': { btts_factor: 0.95, mean_corners: 9.2 },
    'PREMIER_LEAGUE': { btts_factor: 1.10, mean_corners: 10.1 },
    'SERIE_A': { btts_factor: 0.98, mean_corners: 9.4 },
    'LIGA_BETPLAY': { btts_factor: 0.88, mean_corners: 8.9 }
};

const TEAM_STRENGTH_DB = {
    'Real Madrid': { atk: 1.40, def: 0.70, elo: 1950, xgAtk: 1.48, xgDef: 0.65 },
    'Barcelona': { atk: 1.30, def: 0.80, elo: 1900, xgAtk: 1.35, xgDef: 0.74 },
    'Manchester City': { atk: 1.50, def: 0.60, elo: 2000, xgAtk: 1.62, xgDef: 0.58 },
    'Arsenal': { atk: 1.35, def: 0.65, elo: 1920, xgAtk: 1.41, xgDef: 0.62 }
};

const CORNER_POWER = {
    'Real Madrid': { for: 6.2, against: 4.1 },
    'Barcelona': { for: 5.8, against: 4.3 },
    'Manchester City': { for: 7.1, against: 3.5 },
    'Arsenal': { for: 6.0, against: 3.8 }
};

const ALTITUDE_TEAMS = {
    'Bolivar': 3640,
    'The Strongest': 3640,
    'LDU Quito': 2850
};

// ==========================================
// SISTEMA SEGURO DE MANIPULACIÓN DEL DOM (EVITA CRASHES)
// ==========================================
const safeSetHTML = (id, html) => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = html;
};

const safeSetText = (id, txt) => {
    const el = document.getElementById(id);
    if (el) el.textContent = txt;
};

// ==========================================
// MODELAMIENTO ESTADÍSTICO AVANZADO
// ==========================================
function calculateRecentFormWithDecay(matchHistory, type) {
    if (!matchHistory || matchHistory.length === 0) return 1.0;
    let totalWeight = 0, weightedSum = 0;
    
    matchHistory.forEach((match, index) => {
        const weight = Math.exp(-0.18 * index);
        const value = type === 'atk' 
            ? ((match.xg || 1.0) * 0.70 + (match.goals || 0) * 0.30) 
            : ((match.xgAgainst || 1.0) * 0.70 + (match.goalsAgainst || 0) * 0.30);
        weightedSum += value * weight;
        totalWeight += weight;
    });
    return totalWeight > 0 ? (weightedSum / totalWeight) : 1.0;
}

function calculateAdvancedLambdas(home, away, leagueKey, context = {}) {
    const homeData = TEAM_STRENGTH_DB[home] || { atk: 1.0, def: 1.0, elo: 1500, xgAtk: 1.0, xgDef: 1.0 };
    const awayData = TEAM_STRENGTH_DB[away] || { atk: 1.0, def: 1.0, elo: 1500, xgAtk: 1.0, xgDef: 1.0 };
    const leagueAvgGoals = 1.35; 
    
    let homeAtkPower = (homeData.xgAtk * 0.65) + (homeData.atk * 0.35);
    let awayDefPower = (awayData.xgDef * 0.65) + (awayData.def * 0.35);
    let awayAtkPower = (awayData.xgAtk * 0.65) + (awayData.atk * 0.35);
    let homeDefPower = (homeData.xgDef * 0.65) + (homeData.def * 0.35);
    
    if (context.homeMatches) homeAtkPower = calculateRecentFormWithDecay(context.homeMatches, 'atk');
    if (context.homeMatches) homeDefPower = calculateRecentFormWithDecay(context.homeMatches, 'def');
    if (context.awayMatches) awayAtkPower = calculateRecentFormWithDecay(context.awayMatches, 'atk');
    if (context.awayMatches) awayDefPower = calculateRecentFormWithDecay(context.awayMatches, 'def');
    
    let lambdaH = leagueAvgGoals * homeAtkPower * awayDefPower;
    let lambdaA = leagueAvgGoals * awayAtkPower * homeDefPower;
    
    const eloDiff = (homeData.elo || 1500) - (awayData.elo || 1500);
    lambdaH *= (1 + eloDiff / 1200);
    lambdaA *= (1 - eloDiff / 1200);
    
    if (context.homeRestDays && context.homeRestDays < 4) lambdaH *= 0.91;
    if (context.awayRestDays && context.awayRestDays < 4) lambdaA *= 0.91;
    
    if (context.homeMotivation === 'alta') lambdaH *= 1.06;
    if (context.homeMotivation === 'baja') lambdaH *= 0.92;
    if (context.awayMotivation === 'alta') lambdaA *= 1.06;
    if (context.awayMotivation === 'baja') lambdaA *= 0.92;
    
    if (ALTITUDE_TEAMS[home] && ALTITUDE_TEAMS[home] > 2500) {
        lambdaH *= 1.16; lambdaA *= 0.78;
    }
    
    const lambdaGoal = (lambdaH + lambdaA) * 0.44; 
    const homeCorn = CORNER_POWER[home] || { for: 5.3, against: 4.4 };
    const awayCorn = CORNER_POWER[away] || { for: 5.3, against: 4.4 };
    const lambdaCorn = (homeCorn.for + awayCorn.against + homeCorn.against + awayCorn.for) / 2;
    
    return {
        lambdaH: Math.max(0.1, lambdaH),
        lambdaA: Math.max(0.1, lambdaA),
        lambdaGoal: Math.max(0.05, lambdaGoal),
        lambdaCorn: Math.max(4.5, lambdaCorn),
        negBinR: 6.8
    };
}

// ==========================================
// OPERADORES MATEMÁTICOS PUROS (INDICE DE CONTROL)
// ==========================================
function factorial(n) {
    if (n === 0 || n === 1) return 1;
    let r = 1; for (let i = 2; i <= n; i++) r *= i; return r;
}

function poissonProb(k, lambda) {
    return (Math.pow(lambda, k) * Math.exp(-lambda)) / factorial(k);
}

function poissonOver(lambda, line) {
    let probUnder = 0;
    for (let k = 0; k <= Math.floor(line); k++) probUnder += poissonProb(k, lambda);
    return Math.max(0, Math.min(100, (1 - probUnder) * 100));
}

function nCr(n, r) {
    if (r < 0 || r > n) return 0;
    return factorial(n) / (factorial(r) * factorial(n - r));
}

function negBinProb(k, lambda, r) {
    const p = r / (r + lambda);
    return nCr(k + r - 1, k) * Math.pow(p, r) * Math.pow(1 - p, k);
}

function negBinOver(lambda, line, r) {
    let probUnder = 0;
    for (let k = 0; k <= Math.floor(line); k++) probUnder += negBinProb(k, lambda, r);
    return Math.max(0, Math.min(100, (1 - probUnder) * 100));
}

function dixonColesCorrection(x, y, lambdaH, lambdaA) {
    if (x === 0 && y === 0) return 1 - (lambdaH * lambdaA * DIXON_COLES_RHO);
    if (x === 1 && y === 0) return 1 + (lambdaA * DIXON_COLES_RHO);
    if (x === 0 && y === 1) return 1 + (lambdaH * DIXON_COLES_RHO);
    if (x === 1 && y === 1) return 1 - DIXON_COLES_RHO;
    return 1;
}

function plattCalibrate(rawProb, marketType) {
    let sigmoidA = -0.05, sigmoidB = 2.5;
    switch(marketType) {
        case 'goals_over25': sigmoidA = -0.06; sigmoidB = 2.8; break;
        case 'btts':         sigmoidA = -0.04; sigmoidB = 2.1; break;
        case 'resultado':    sigmoidA = -0.05; sigmoidB = 2.4; break;
        case 'corners':      sigmoidA = -0.07; sigmoidB = 3.2; break;
    }
    const calibrated = 1 / (1 + Math.exp(sigmoidA * rawProb + sigmoidB));
    return Math.max(1, Math.min(99, calibrated * 100));
}

function calcBTTS(lambdaH, lambdaA, leagueKey) {
    const pH0 = poissonProb(0, lambdaH);
    const pA0 = poissonProb(0, lambdaA);
    return (1 - pH0) * (1 - pA0) * 100 * (LIGAS[leagueKey]?.btts_factor || 1.0);
}

function calcResultProbs(lambdaH, lambdaA, leagueKey) {
    let home = 0, draw = 0, away = 0; const maxGoals = 12;
    for (let h = 0; h <= maxGoals; h++) {
        for (let a = 0; a <= maxGoals; a++) {
            let p = poissonProb(h, lambdaH) * poissonProb(a, lambdaA) * dixonColesCorrection(h, a, lambdaH, lambdaA);
            if (h > a) home += p; else if (h === a) draw += p; else away += p;
        }
    }
    const total = home + draw + away || 1;
    return { home: (home / total) * 100, draw: (draw / total) * 100, away: (away / total) * 100 };
}

// ==========================================
// MOTOR DE RENDIMIENTO E INTERFAZ GRÁFICA
// ==========================================
function buildRecommendation(marketsArray) {
    const valid = marketsArray.filter(m => m && m.prob >= 55);
    if (valid.length === 0) return { top: null, top3: [], isAggressive: false };
    valid.sort((a, b) => b.prob - a.prob);
    
    const top = valid[0];
    let confidenceLevel = 'baja'; let diamond = '';
    if (top.prob >= 75) { confidenceLevel = 'alta'; diamond = '💎'; }
    else if (top.prob >= 65) { confidenceLevel = 'media'; }
    
    const isAggressive = top.prob < 68 && (top.type === 'resultado' || top.type === 'ht');
    top.confidenceLevel = confidenceLevel; top.diamond = diamond;
    return { top, top3: valid.slice(0, 3), isAggressive };
}

function mktCard(title, rawProb, type, id, alternativeLabel) {
    const calibrated = plattCalibrate(rawProb, type);
    return `
        <div class="mkt-card animate-in" id="card-${id}">
            <div class="mkt-card-title">${title}</div>
            <div class="mkt-card-prob">${calibrated.toFixed(1)}%</div>
        </div>`;
}

function renderDashboard(home, away, lambdaH, lambdaA, lambdaGoal, lambdaCorn, negBinR, mkt) {
    let html = '<div class="mkt-grid">';
    
    if(mkt.goles){
        const l = lambdaH + lambdaA;
        html += `<div class="section-header"><span class="cal-badge">GOLES</span></div>`;
        html += mktCard('GOLES OVER 1.5', poissonOver(l, 1.5), 'goals_over25', 1, 'Under');
        html += mktCard('GOLES OVER 2.5', poissonOver(l, 2.5), 'goals_over25', 2, 'Under');
    }
    if(mkt.btts){
        html += `<div class="section-header"><span class="cal-badge">AMBOS MARCAN</span></div>`;
        html += mktCard('AMBOS MARCAN (SÍ)', calcBTTS(lambdaH, lambdaA, currentLeagueKey), 'btts', 3, 'No');
    }
    if(mkt.corn){
        html += `<div class="section-header"><span class="section-title">CÓRNERS</span><span class="section-lambda">λ ${lambdaCorn.toFixed(1)}</span></div>`;
        [7.5, 8.5, 9.5].forEach((line, i) => {
            html += mktCard(`CÓRNERS OVER ${line}`, negBinOver(lambdaCorn, line, negBinR), 'corners', i + 4, 'Under');
        });
    }
    html += '</div>';
    
    safeSetHTML('all-markets-container', html);
    
    // Compilar array "all" de manera ultra segura para el calculador de valor
    const all = [];
    const l = lambdaH + lambdaA;
    all.push({label: 'GOLES OVER 1.5', prob: Math.round(plattCalibrate(poissonOver(l, 1.5), 'goals_over25')), desc: 'Alta probabilidad de goles', type: 'goles'});
    all.push({label: 'GOLES OVER 2.5', prob: Math.round(plattCalibrate(poissonOver(l, 2.5), 'goals_over25')), desc: 'Línea estándar de 3 goles', type: 'goles'});
    all.push({label: 'AMBOS MARCAN', prob: Math.round(plattCalibrate(calcBTTS(lambdaH, lambdaA, currentLeagueKey), 'btts')), desc: 'Intercambio de goles ofensivo', type: 'btts'});
    
    [7.5, 8.5, 9.5].forEach(line => {
        all.push({label: `CÓRNERS OVER ${line}`, prob: Math.round(plattCalibrate(negBinOver(lambdaCorn, line, negBinR), 'corners')), desc: `Línea de saques de esquina`, type: 'corners'});
    });
    
    const rp = calcResultProbs(lambdaH, lambdaA, currentLeagueKey);
    const rph = Math.round(plattCalibrate(rp.home, 'resultado'));
    const rpa = Math.round(plattCalibrate(rp.away, 'resultado'));
    
    const shortHome = home.split(' ').slice(-1)[0] || 'Local';
    const shortAway = away.split(' ').slice(-1)[0] || 'Visitante';
    all.push({label: 'VICTORIA LOCAL', prob: rph, desc: `${shortHome} con ventaja de campo`, type: 'resultado'});
    all.push({label: 'VICTORIA VISITANTE', prob: rpa, desc: `${shortAway} peligroso de visita`, type: 'resultado'});
    
    // Renderizado de la recomendación inteligente
    const rec = buildRecommendation(all);
    if(!rec.top){
        safeSetHTML('recomendacion-container', `
            <div class="recomendacion animate-in" style="border-color:var(--accent);">
                <div class="rec-title" style="color:var(--accent);">SIN APUESTA CLARA</div>
                <div class="rec-sub">Ningún mercado supera los umbral de confianza estadística rigurosa de hoy.</div>
            </div>`);
    } else {
        const tb = rec.top;
        const cls = tb.prob >= 70 ? 'var(--green)' : tb.prob >= 60 ? 'var(--yellow)' : 'var(--accent)';
        const conf = tb.confidenceLevel === 'alta' ? 'CONFIANZA ALTA' : tb.confidenceLevel === 'media' ? 'CONFIANZA MEDIA' : 'ALTO RIESGO';
        
        let top3h = '';
        if(rec.top3 && rec.top3.length > 1){
            top3h = rec.top3.slice(1).map((b, i) => {
                const c = b.prob >= 70 ? 'var(--green)' : b.prob >= 60 ? 'var(--yellow)' : 'var(--accent)';
                return `
                    <div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid rgba(255,255,255,0.05);">
                        <span style="font-size:0.75rem;opacity:0.6;">#${i+2}</span>
                        <span style="flex:1;font-weight:600;font-size:0.8rem;">${b.label}</span>
                        <span style="font-size:0.9rem;color:${c};font-weight:bold;">${Number(b.prob).toFixed(0)}%</span>
                    </div>`;
            }).join('');
        }
        
        safeSetHTML('recomendacion-container', `
            <div class="recomendacion animate-in" style="border-color:${rec.isAggressive ? 'var(--accent)' : 'var(--green)'};">
                <div class="rec-title" style="color:${rec.isAggressive ? 'var(--accent)' : 'var(--green)'};">${rec.isAggressive ? '⚡ APUESTA AGRESIVA' : '🎯 MEJOR APUESTA'}</div>
                <div class="rec-main" style="color:${cls};">${tb.label} ${tb.diamond || ''}</div>
                <div class="rec-sub">${tb.desc}</div>
                <div class="rec-confidence" style="color:${cls};">
                    <span>${Number(tb.prob).toFixed(0)}%</span> • <span>${conf}</span>
                </div>
                ${top3h ? `<div style="margin-top:15px;"><div style="font-size:0.65rem;color:var(--muted);font-weight:bold;margin-bottom:4px;letter-spacing:1px;">🔎 OPCIONES SECUNDARIAS</div>${top3h}</div>` : ''}
            </div>`);
    }
}

function renderResultBoxes(lH, lA){
    const rp = calcResultProbs(lH, lA, currentLeagueKey);
    const r = {
        home: +plattCalibrate(rp.home, 'resultado').toFixed(1),
        draw: +plattCalibrate(rp.draw, 'resultado').toFixed(1),
        away: +plattCalibrate(rp.away, 'resultado').toFixed(1)
    };
    const mx = Math.max(r.home, r.draw, r.away);
    const rc = v => v === mx ? 'var(--green)' : v >= 30 ? 'var(--yellow)' : 'var(--accent)';
    
    const html = `
        <div class="section-header"><span class="cal-badge">PROBABILIDADES 1X2</span></div>
        <div class="result-boxes animate-in">
            <div class="result-box"><div class="rb-label">🏠 Local</div><div class="rb-pct" style="color:${rc(r.home)};">${r.home}%</div></div>
            <div class="result-box"><div class="rb-label">🟡 Empate</div><div class="rb-pct" style="color:${rc(r.draw)};">${r.draw}%</div></div>
            <div class="result-box"><div class="rb-label">✈️ Visitante</div><div class="rb-pct" style="color:${rc(r.away)};">${r.away}%</div></div>
        </div>`;
    safeSetHTML('result-boxes-container', html);
}

// ==========================================
// ORQUESTADOR DE INICIALIZACIÓN DE LA CANALIZACIÓN
// ==========================================
function executePredictionPipeline(homeTeam, awayTeam, leagueKey, contextData) {
    try {
        currentLeagueKey = leagueKey;
        const advancedLambdas = calculateAdvancedLambdas(homeTeam, awayTeam, leagueKey, contextData);
        const mktActive = { goles: true, ht: true, btts: true, corn: true };
        
        renderDashboard(
            homeTeam, awayTeam, 
            advancedLambdas.lambdaH, advancedLambdas.lambdaA, 
            advancedLambdas.lambdaGoal, advancedLambdas.lambdaCorn, 
            advancedLambdas.negBinR, mktActive
        );
        renderResultBoxes(advancedLambdas.lambdaH, advancedLambdas.lambdaA);
    } catch (err) {
        console.error("Error crítico en la canalización del renderizado:", err);
    }
}

// Carga asíncrona robusta controlando caídas de la API externa
window.onload = async () => {
    try {
        let all = [], url = BSD_BASE + '/leagues/?page_size=100', p = 0;
        
        // Timeout controlado para prevenir congelamientos permanentes de red
        while(url && p < 3){
            const fp = fetch(url, { headers: { 'Authorization': 'Token ' + BSD_TOKEN } });
            const tp = new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 4000));
            const r = await Promise.race([fp, tp]);
            
            if(!r.ok) break;
            const d = await r.json(); 
            all = all.concat(d.results || []);
            url = d.next || null; p++;
        }
        
        if (all.length > 0) {
            all.forEach(l => {
                if (!l || !l.name || l.is_women) return;
                for (const c of Object.keys(LIGAS)) {
                    if (l.name.toLowerCase().includes(c.toLowerCase()) && !bsdLeagueMap[c]) {
                        bsdLeagueMap[c] = { bsdId: l.id, seasonId: l.current_season?.id };
                    }
                }
            });
            apiAvailable = true;
            safeSetText('engine-badge', '🛰️ Motor v2.5: BSD API Conectada + Contexto Dinámico');
        } else {
            safeSetText('engine-badge', '🛰️ Motor v2.5 Híbrido: Corriendo en Modo Local Optimizando Contexto');
        }
    } catch(e) {
        console.log("Fallo de API manejado con éxito. Corriendo offline.");
        safeSetText('engine-badge', '🛰️ Motor v2.5 Híbrido: Modo de Respaldo Local Activo');
    }

    // --- PROCESAMIENTO INMEDIATO DEL PARTIDO DE PRUEBA ---
    const mockHomeMatches = [
        { goals: 3, xg: 2.45, goalsAgainst: 0, xgAgainst: 0.41 },
        { goals: 2, xg: 1.90, goalsAgainst: 1, xgAgainst: 0.85 }
    ];
    const mockContext = {
        homeMatches: mockHomeMatches,
        awayMatches: null,
        homeRestDays: 3,       // Alerta de cansancio
        homeMotivation: 'alta', // Máxima urgencia
        awayMotivation: 'normal'
    };

    // Esto ejecutará la predicción de inmediato, eliminando cualquier pantalla congelada
    executePredictionPipeline('Manchester City', 'Real Madrid', 'PREMIER_LEAGUE', mockContext);
};
</script>
</body>
