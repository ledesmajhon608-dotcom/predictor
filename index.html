<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictor Pro 2026 - Conexión Total</title>
    <style>
        :root { --bg: #050810; --card: #111827; --accent: #00f2ff; --success: #10b981; --border: #1f2937; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; }
        .container { width: 100%; max-width: 450px; margin: auto; }
        .header { text-align: center; padding: 20px; background: rgba(0,242,255,0.05); border-radius: 20px; margin-bottom: 20px; border: 1px solid rgba(0,242,255,0.1); }
        .selector-box { background: var(--card); border-radius: 18px; padding: 18px; border: 1px solid var(--border); margin-bottom: 20px; }
        label { font-size: 0.7rem; color: #9ca3af; display: block; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        select { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 10px; color: white; margin-bottom: 15px; font-size: 0.9rem; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.3s; margin-bottom: 10px; }
        .btn-api { background: #1f2937; color: var(--accent); border: 1px solid var(--accent); }
        .btn-predict { background: var(--accent); color: var(--bg); }
        .status-msg { font-size: 0.7rem; text-align: center; margin-bottom: 10px; padding: 5px; border-radius: 5px; }
        .status-online { color: var(--success); background: rgba(16,185,129,0.1); }
        .status-offline { color: #facc15; background: rgba(250,204,21,0.1); }
        .result-card { background: var(--card); border-radius: 18px; padding: 20px; border: 1px solid var(--border); animation: fadeIn 0.4s ease; }
        .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .stat-item { background: rgba(255,255,255,0.02); padding: 12px; border-radius: 12px; text-align: center; border: 1px solid var(--border); }
        .stat-val { display: block; font-size: 1.2rem; color: var(--success); font-weight: 800; }
        @keyframes fadeIn { from { opacity:0; transform: translateY(5px); } to { opacity:1; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0; font-size:1.4rem;">📊 PREDICTOR PRO 2026</h1>
        <div id="api-status" class="status-msg">Iniciando sistema...</div>
    </div>

    <div class="selector-box">
        <button class="btn btn-api" onclick="cargarDatos()">🔄 ACTUALIZAR PARTIDOS (API)</button>
        
        <label>Liga / Competición</label>
        <select id="liga-select" onchange="actualizarEquipos()"></select>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div>
                <label>Local</label>
                <select id="equipoL"></select>
            </div>
            <div>
                <label>Visitante</label>
                <select id="equipoV"></select>
            </div>
        </div>

        <button class="btn btn-predict" onclick="generarPrediccion()">⚡ ANALIZAR PARTIDO</button>
    </div>

    <div id="resultado"></div>
</div>

<script>
    const TOKEN = 'D1c591c865f3f9dd0d9f8d60337c895a94c4683e';
    
    // Base de datos de respaldo (2025/2026) si la API no tiene partidos hoy
    const respaldo2026 = {
        "Copa Libertadores 2026": ["Flamengo", "River Plate", "Palmeiras", "Boca Juniors", "Peñarol", "Colo Colo", "LDU Quito", "Atlético Mineiro", "Fluminense", "Nacional", "Bolívar", "Millonarios"],
        "UEFA Champions League": ["Real Madrid", "Man City", "Liverpool", "Bayern Munich", "Arsenal", "Barcelona", "Inter", "PSG", "Bayer Leverkusen", "Juventus", "Borussia Dortmund", "Aston Villa"],
        "Premier League 25/26": ["Arsenal", "Liverpool", "Man City", "Chelsea", "Man United", "Tottenham", "Aston Villa", "Newcastle"],
        "La Liga 25/26": ["Real Madrid", "Barcelona", "Atlético Madrid", "Girona", "Real Sociedad", "Athletic Club", "Real Betis", "Sevilla"]
    };

    let modoAPI = false;

    async function cargarDatos() {
        const status = document.getElementById('api-status');
        status.innerHTML = "⌛ Conectando con BSD Sports...";
        
        try {
            // Probamos con el endpoint de fixtures (partidos programados)
            const response = await fetch(`https://sports.bzzoiro.com/api/fixtures?token=${TOKEN}`);
            const data = await response.json();
            const partidos = data.data || [];

            if (partidos.length > 0) {
                modoAPI = true;
                status.className = "status-msg status-online";
                status.innerHTML = `✅ API ONLINE: ${partidos.length} partidos encontrados.`;
                procesarLigasAPI(partidos);
            } else {
                throw new Error("Sin partidos");
            }
        } catch (e) {
            modoAPI = false;
            status.className = "status-msg status-offline";
            status.innerHTML = "⚠️ API sin partidos hoy. Usando Base de Datos 2026.";
            procesarLigasRespaldo();
        }
    }

    function procesarLigasRespaldo() {
        const ligaSel = document.getElementById('liga-select');
        ligaSel.innerHTML = "";
        Object.keys(respaldo2026).forEach(l => {
            let opt = document.createElement('option');
            opt.value = l; opt.text = l; ligaSel.add(opt);
        });
        actualizarEquipos();
    }

    function actualizarEquipos() {
        const liga = document.getElementById('liga-select').value;
        const el = document.getElementById('equipoL');
        const ev = document.getElementById('equipoV');
        el.innerHTML = ""; ev.innerHTML = "";

        if (!modoAPI) {
            respaldo2026[liga].forEach(eq => {
                el.add(new Option(eq, eq));
                ev.add(new Option(eq, eq));
            });
            ev.selectedIndex = 1;
        }
    }

    function generarPrediccion() {
        const local = document.getElementById('equipoL').value;
        const visita = document.getElementById('equipoV').value;
        if(local === visita) return alert("Selecciona equipos distintos");

        const resDiv = document.getElementById('resultado');
        const probHT = Math.floor(Math.random() * (92 - 78) + 78);

        resDiv.innerHTML = `
            <div class="result-card">
                <div style="text-align:center; margin-bottom:15px; font-weight:bold;">
                    ${local} vs ${visita}
                </div>
                <div class="grid-stats">
                    <div class="stat-item"><label>+0.5 HT</label><span class="stat-val">${probHT}%</span></div>
                    <div class="stat-item"><label>+1.5 FINAL</label><span class="stat-val">${probHT + 5}%</span></div>
                    <div class="stat-item"><label>BTTS</label><span class="stat-val">72%</span></div>
                    <div class="stat-item"><label>CÓRNERS</label><span class="stat-val">9.5</span></div>
                </div>
                <div style="margin-top:15px; padding:10px; background:rgba(0,242,255,0.1); border:1px solid var(--accent); border-radius:10px; text-align:center; font-size:0.8rem;">
                    🎯 RECO: ENTRADA CONFIRMADA +0.5 HT (LIVE)
                </div>
            </div>
        `;
    }

    // Iniciar automáticamente
    cargarDatos();
</script>
</body>
</html>
