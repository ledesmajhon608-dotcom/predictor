<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictor Pro - Acceso Total API</title>
    <style>
        :root { --bg: #050810; --card: #111827; --accent: #00f2ff; --success: #10b981; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; }
        .container { width: 100%; max-width: 450px; margin: auto; }
        .header { text-align: center; padding: 20px; background: rgba(0,242,255,0.05); border-radius: 20px; margin-bottom: 20px; border: 1px solid rgba(0,242,255,0.1); }
        .main-button { width: 100%; padding: 18px; background: var(--accent); color: var(--bg); border: none; border-radius: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 0 20px rgba(0,242,255,0.2); text-transform: uppercase; width: 100%; }
        .match-card { background: var(--card); border-radius: 18px; padding: 18px; margin-bottom: 15px; border: 1px solid #1f2937; animation: slideIn 0.3s ease-out; }
        .league-badge { font-size: 0.6rem; color: var(--accent); background: rgba(0,242,255,0.1); padding: 3px 8px; border-radius: 4px; text-transform: uppercase; font-weight: bold; }
        .teams { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.05rem; margin: 12px 0; align-items: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background: rgba(255,255,255,0.02); padding: 10px; border-radius: 12px; text-align: center; border: 1px solid #1f2937; }
        .stat-label { font-size: 0.6rem; color: #9ca3af; display: block; margin-bottom: 4px; }
        .real-prob { font-size: 0.95rem; color: var(--success); font-weight: 800; }
        .recommendation { grid-column: span 2; margin-top: 12px; padding: 10px; border-radius: 10px; text-align: center; font-weight: 800; background: rgba(16,185,129,0.1); color: #34d399; border: 1px solid #10b981; font-size: 0.75rem; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0; font-size: 1.4rem;">📊 PREDICTOR PRO</h1>
        <p style="margin:5px 0 0; font-size:0.8rem; color:var(--accent);">Analizador Multiliga Ilimitado</p>
    </div>

    <button class="main-button" onclick="obtenerTodosLosPartidos()">⚡ ESCANEAR TODAS LAS LIGAS</button>
    <div id="status" style="text-align:center; margin:15px; font-size:0.8rem; color:#64748b;"></div>
    <div id="results"></div>
</div>

<script>
    const TOKEN = 'D1c591c865f3f9dd0d9f8d60337c895a94c4683e';

    function poisson(media, x) {
        const e = 2.71828;
        let fact = 1;
        for (let i = 1; i <= x; i++) fact *= i;
        return (Math.pow(media, x) * Math.pow(e, -media)) / fact;
    }

    async function obtenerTodosLosPartidos() {
        const results = document.getElementById('results');
        const status = document.getElementById('status');
        results.innerHTML = '';
        status.innerHTML = "Extrayendo todos los eventos disponibles...";

        try {
            // Petición directa a la API para traer todo lo del día
            const response = await fetch(`https://sports.bzzoiro.com/api/fixtures?token=${TOKEN}`);
            const data = await response.json();
            const partidos = data.data || data.results || [];

            if (partidos.length === 0) {
                status.innerHTML = "⚠️ La API no devolvió partidos en este momento. Intenta en unos minutos.";
                return;
            }

            status.innerHTML = `✅ ¡Éxito! Se encontraron ${partidos.length} partidos en tus ligas.`;

            partidos.forEach(p => {
                // Cálculo de Poisson basado en un promedio de liga estándar (2.7 goles)
                const mediaGoles = 2.7;
                const probHT = Math.floor((1 - poisson(mediaGoles, 0)) * 88);
                const probFT = Math.floor((1 - poisson(mediaGoles, 0)) * 96);

                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `
                    <span class="league-badge">${p.league_name || 'Competencia'}</span>
                    <div class="teams">
                        <span>${p.home_name}</span>
                        <span style="font-size:0.7rem; color:#1f2937;">VS</span>
                        <span>${p.away_name}</span>
                    </div>
                    <div class="grid">
                        <div class="stat-box"><span class="stat-label">+0.5 HT</span><span class="real-prob">${probHT}%</span></div>
                        <div class="stat-box"><span class="stat-label">+1.5 FINAL</span><span class="real-prob">${probFT}%</span></div>
                        <div class="stat-box"><span class="stat-label">BTTS</span><span class="real-prob">${Math.floor(probHT * 0.9)}%</span></div>
                        <div class="stat-box"><span class="stat-label">CÓRNERS</span><span class="real-prob">${(Math.random() * (10.5 - 8.5) + 8.5).toFixed(1)}</span></div>
                        <div class="recommendation">🎯 RECO: ${probHT > 80 ? 'ENTRADA CONFIRMADA +0.5 HT' : 'ESTRATEGIA LIVE'}</div>
                    </div>
                `;
                results.appendChild(card);
            });

        } catch (e) {
            status.innerHTML = "❌ Error al conectar con la API. Verifica el Token.";
        }
    }
</script>
</body>
</html>
