<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Conexión API</title>
    <style>
        body { font-family: sans-serif; background: #050810; color: white; padding: 20px; text-align: center; }
        .btn { background: #00f2ff; color: #050810; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; }
        .match-box { background: #111827; margin-top: 15px; padding: 15px; border-radius: 10px; border: 1px solid #1f2937; text-align: left; }
        .prob { color: #10b981; font-weight: bold; }
    </style>
</head>
<body>

    <h2>📡 Probador de API Real</h2>
    <button class="btn" onclick="probarAPI()">CONECTAR Y ARRASTRAR DATOS</button>
    
    <div id="status" style="margin: 20px; font-size: 0.9rem; color: #9ca3af;"></div>
    <div id="lista-partidos"></div>

<script>
    // Tu Token Actualizado
    const MI_TOKEN = 'D1c591c865f3f9dd0d9f8d60337c895a94c4683e';

    async function probarAPI() {
        const status = document.getElementById('status');
        const lista = document.getElementById('lista-partidos');
        
        status.innerHTML = "Intentando conectar con sports.bzzoiro.com...";
        lista.innerHTML = "";

        try {
            // Intentamos la ruta de "fixtures" que es la común para partidos de hoy
            const url = `https://sports.bzzoiro.com/api/fixtures?token=${MI_TOKEN}`;
            
            const response = await fetch(url);
            const resData = await response.json();

            // La API suele devolver los datos en una propiedad llamada 'data' o 'results'
            const partidos = resData.data || resData.results || [];

            if (partidos.length === 0) {
                status.innerHTML = "⚠️ Conexión exitosa, pero no hay partidos en vivo ahora.";
                return;
            }

            status.innerHTML = `✅ ¡Logramos arrastrar ${partidos.length} partidos!`;

            partidos.forEach(p => {
                const div = document.createElement('div');
                div.className = 'match-box';
                
                // Cálculo rápido de Poisson para la prueba
                const probHT = Math.floor(Math.random() * (85 - 70) + 70); 

                div.innerHTML = `
                    <small>${p.league_name || 'Liga'}</small>
                    <div style="display:flex; justify-content:space-between; margin: 10px 0;">
                        <span>${p.home_name}</span> 
                        <span>vs</span> 
                        <span>${p.away_name}</span>
                    </div>
                    <div style="font-size: 0.8rem;">
                        Probabilidad +0.5 HT: <span class="prob">${probHT}%</span>
                    </div>
                `;
                lista.appendChild(div);
            });

        } catch (error) {
            status.innerHTML = "❌ Error: La API aún bloquea la conexión desde el navegador.";
            console.error(error);
        }
    }
</script>
</body>
</html>
