<script>
// ==========================================
// CONFIGURACIÓN Y BASES DE DATOS INTEGRADAS
// ==========================================
const BSD_BASE = 'https://api.bsdfootball.com/v1'; 
const BSD_TOKEN = 'TU_TOKEN_AQUÍ'; 
const DIXON_COLES_RHO = -0.05;

let currentLeagueKey = 'PREMIER_LEAGUE';
const activeMarkets = { goles: true, goles_full: true, btts: true, corners: true };

const LIGAS = {
    'PREMIER_LEAGUE': { name: 'Premier League', btts_factor: 1.10, mean_corners: 10.1, teams: ['Manchester City', 'Arsenal', 'Liverpool', 'Chelsea'] },
    'LA_LIGA': { name: 'La Liga', btts_factor: 0.95, mean_corners: 9.2, teams: ['Real Madrid', 'Barcelona', 'Atletico Madrid', 'Sevilla'] },
    'SERIE_A': { name: 'Serie A', btts_factor: 0.98, mean_corners: 9.4, teams: ['Atalanta BC', 'Bologna FC 1909', 'Juventus', 'Inter'] },
    'LIGA_BETPLAY': { name: 'Liga BetPlay', btts_factor: 0.88, mean_corners: 8.9, teams: ['Bolivar', 'The Strongest', 'LDU Quito'] }
};

const TEAM_STRENGTH_DB = {
    'Real Madrid': { atk: 1.40, def: 0.70, elo: 1950, xgAtk: 1.48, xgDef: 0.65 },
    'Barcelona': { atk: 1.30, def: 0.80, elo: 1900, xgAtk: 1.35, xgDef: 0.74 },
    'Manchester City': { atk: 1.50, def: 0.60, elo: 2000, xgAtk: 1.62, xgDef: 0.58 },
    'Arsenal': { atk: 1.35, def: 0.65, elo: 1920, xgAtk: 1.41, xgDef: 0.62 },
    'Atalanta BC': { atk: 1.25, def: 0.85, elo: 1810, xgAtk: 1.32, xgDef: 0.80 },
    'Bologna FC 1909': { atk: 1.10, def: 0.75, elo: 1740, xgAtk: 1.18, xgDef: 0.72 },
    'Bolivar': { atk: 1.20, def: 0.90, elo: 1600, xgAtk: 1.25, xgDef: 0.88 }
};

const CORNER_POWER = {
    'Real Madrid': { for: 6.2, against: 4.1 },
    'Barcelona': { for: 5.8, against: 4.3 },
    'Manchester City': { for: 7.1, against: 3.5 },
    'Atalanta BC': { for: 5.9, against: 4.2 },
    'Bologna FC 1909': { for: 5.1, against: 4.5 }
};

const ALTITUDE_TEAMS = { 'Bolivar': 3640, 'The Strongest': 3640, 'LDU Quito': 2850 };

// ==========================================
// CORE MATEMÁTICO v2.5 (XG, TIME DECAY, CONTEXTO)
// ==========================================
function calculateRecentFormWithDecay(matchHistory, type) {
    if (!matchHistory || matchHistory.length === 0) return 1.0;
    let totalWeight = 0, weightedSum = 0;
    matchHistory.forEach((match, index) => {
        const weight = Math.exp(-0.18 * index);
        const value = type === 'atk' 
            ? ((match.xg || 1.0) * 0.70 + (match.goals || 0) * 0.30) 
            : ((match.xgAgainst || 1.0) * 0.70 + (match.goalsAgainst || 0) * 0.30);
        weightedSum += value * weight;
        totalWeight += weight;
    });
    return totalWeight > 0 ? (weightedSum / totalWeight) : 1.0;
}

function calculateAdvancedLambdas(home, away, leagueKey, context = {}) {
    const homeData = TEAM_STRENGTH_DB[home] || { atk: 1.0, def: 1.0, elo: 1500, xgAtk: 1.0, xgDef: 1.0 };
    const awayData = TEAM_STRENGTH_DB[away] || { atk: 1.0, def: 1.0, elo: 1500, xgAtk: 1.0, xgDef: 1.0 };
    const leagueAvgGoals = 1.35; 
    
    let homeAtkPower = (homeData.xgAtk * 0.65) + (homeData.atk * 0.35);
    let awayDefPower = (awayData.xgDef * 0.65) + (awayData.def * 0.35);
    let awayAtkPower = (awayData.xgAtk * 0.65) + (awayData.atk * 0.35);
    let homeDefPower = (homeData.xgDef * 0.65) + (homeData.def * 0.35);
    
    if (context.homeMatches) homeAtkPower = calculateRecentFormWithDecay(context.homeMatches, 'atk');
    if (context.homeMatches) homeDefPower = calculateRecentFormWithDecay(context.homeMatches, 'def');
    if (context.awayMatches) awayAtkPower = calculateRecentFormWithDecay(context.awayMatches, 'atk');
    if (context.awayMatches) awayDefPower = calculateRecentFormWithDecay(context.awayMatches, 'def');
    
    let lambdaH = leagueAvgGoals * homeAtkPower * awayDefPower;
    let lambdaA = leagueAvgGoals * awayAtkPower * homeDefPower;
    
    const eloDiff = (homeData.elo || 1500) - (awayData.elo || 1500);
    lambdaH *= (1 + eloDiff / 1200); lambdaA *= (1 - eloDiff / 1200);
    
    if (context.homeRestDays && context.homeRestDays < 4) lambdaH *= 0.91;
    if (context.awayRestDays && context.awayRestDays < 4) lambdaA *= 0.91;
    if (context.homeMotivation === 'alta') lambdaH *= 1.06;
    if (context.awayMotivation === 'alta') lambdaA *= 1.06;
    
    if (ALTITUDE_TEAMS[home] && ALTITUDE_TEAMS[home] > 2500) {
        lambdaH *= 1.16; lambdaA *= 0.78;
    }
    
    const lambdaGoal = (lambdaH + lambdaA) * 0.44; 
    const homeCorn = CORNER_POWER[home] || { for: 5.3, against: 4.4 };
    const awayCorn = CORNER_POWER[away] || { for: 5.3, against: 4.4 };
    const lambdaCorn = (homeCorn.for + awayCorn.against + homeCorn.against + awayCorn.for) / 2;
    
    return {
        lambdaH: Math.max(0.1, lambdaH), lambdaA: Math.max(0.1, lambdaA),
        lambdaGoal: Math.max(0.05, lambdaGoal), lambdaCorn: Math.max(4.5, lambdaCorn), negBinR: 6.8
    };
}

// ==========================================
// DISTRIBUCIONES POISSON & DIXON-COLES
// ==========================================
function factorial(n) { if (n <= 1) return 1; let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }
function poissonProb(k, lambda) { return (Math.pow(lambda, k) * Math.exp(-lambda)) / factorial(k); }
function poissonOver(lambda, line) {
    let probUnder = 0; for (let k = 0; k <= Math.floor(line); k++) probUnder += poissonProb(k, lambda);
    return Math.max(0, Math.min(100, (1 - probUnder) * 100));
}
function nCr(n, r) { if (r < 0 || r > n) return 0; return factorial(n) / (factorial(r) * factorial(n - r)); }
function negBinOver(lambda, line, r) {
    let probUnder = 0;
    const p = r / (r + lambda);
    for (let k = 0; k <= Math.floor(line); k++) {
        probUnder += nCr(k + r - 1, k) * Math.pow(p, r) * Math.pow(1 - p, k);
    }
    return Math.max(0, Math.min(100, (1 - probUnder) * 100));
}
function dixonColesCorrection(x, y, lambdaH, lambdaA) {
    if (x === 0 && y === 0) return 1 - (lambdaH * lambdaA * DIXON_COLES_RHO);
    if (x === 1 && y === 0) return 1 + (lambdaA * DIXON_COLES_RHO);
    if (x === 0 && y === 1) return 1 + (lambdaH * DIXON_COLES_RHO);
    if (x === 1 && y === 1) return 1 - DIXON_COLES_RHO;
    return 1;
}
function plattCalibrate(rawProb, marketType) {
    let sigmoidA = -0.05, sigmoidB = 2.5;
    switch(marketType) {
        case 'goals':   sigmoidA = -0.06; sigmoidB = 2.8; break;
        case 'btts':    sigmoidA = -0.04; sigmoidB = 2.1; break;
        case 'result':  sigmoidA = -0.05; sigmoidB = 2.4; break;
        case 'corners': sigmoidA = -0.07; sigmoidB = 3.2; break;
    }
    return Math.max(1, Math.min(99, (1 / (1 + Math.exp(sigmoidA * rawProb + sigmoidB))) * 100));
}

function calcResultProbs(lambdaH, lambdaA) {
    let home = 0, draw = 0, away = 0;
    for (let h = 0; h <= 10; h++) {
        for (let a = 0; a <= 10; a++) {
            let p = poissonProb(h, lambdaH) * poissonProb(a, lambdaA) * dixonColesCorrection(h, a, lambdaH, lambdaA);
            if (h > a) home += p; else if (h === a) draw += p; else away += p;
        }
    }
    const total = home + draw + away || 1;
    return { home: (home/total)*100, draw: (draw/total)*100, away: (away/total)*100 };
}

// ==========================================
// RENDERIZADO DE INTERFAZ GRÁFICA (COMPATIBLE IMAGEN 2)
// ==========================================
function renderProgressBarRow(label, rawProb, type) {
    const calibrated = plattCalibrate(rawProb, type);
    const barClass = calibrated >= 70 ? 'green' : calibrated >= 50 ? 'yellow' : 'accent';
    return `
        <div class="row-market">
            <div class="row-meta">
                <span class="line-text">${label}</span>
                <span class="prob-text">${calibrated.toFixed(0)}%</span>
            </div>
            <div class="progress-container">
                <div class="progress-bar ${barClass}" style="width: ${calibrated}%"></div>
            </div>
        </div>`;
}

function processAndRenderUI() {
    const homeTeam = document.getElementById('select-home').value;
    const awayTeam = document.getElementById('select-away').value;
    
    // Simulación controlada de contexto v2.5 para refinar el cálculo interno
    const mockContext = {
        homeMatches: [{ goals: 2, xg: 1.80, goalsAgainst: 1, xgAgainst: 0.90 }],
        homeRestDays: 5, homeMotivation: 'alta', awayMotivation: 'normal'
    };
    
    const lambdas = calculateAdvancedLambdas(homeTeam, awayTeam, currentLeagueKey, mockContext);
    
    // Actualizar Panel 1X2 superior
    const rp = calcResultProbs(lambdas.lambdaH, lambdas.lambdaA);
    document.getElementById('pct-1x2-home').textContent = plattCalibrate(rp.home, 'result').toFixed(1) + '%';
    document.getElementById('pct-1x2-draw').textContent = plattCalibrate(rp.draw, 'result').toFixed(1) + '%';
    document.getElementById('pct-1x2-away').textContent = plattCalibrate(rp.away, 'result').toFixed(1) + '%';
    document.getElementById('match-header-text').textContent = `${homeTeam} VS ${awayTeam}`;

    let blocksHtml = '';
    const recommendationsArray = [];

    // Bloque GOLES (Si está activo)
    if (activeMarkets.goles_full) {
        const sumL = lambdas.lambdaH + lambdas.lambdaA;
        const p15 = plattCalibrate(poissonOver(sumL, 1.5), 'goals');
        const p25 = plattCalibrate(poissonOver(sumL, 2.5), 'goals');
        
        blocksHtml += `
            <div class="market-block">
                <div class="block-header">
                    <span class="block-title">⚽ GOLES</span>
                    <span class="block-lambda">λ ${sumL.toFixed(2)}</span>
                </div>
                ${renderProgressBarRow('+1.5 Goles', poissonOver(sumL, 1.5), 'goals')}
                ${renderProgressBarRow('+2.5 Goles', poissonOver(sumL, 2.5), 'goals')}
            </div>`;
            
        recommendationsArray.push({ label: 'GOLES OVER 1.5', prob: p15, desc: 'Alta prob. de partido con goles' });
        recommendationsArray.push({ label: 'GOLES OVER 2.5', prob: p25, desc: 'Línea de juego ofensiva abierta' });
    }

    // Bloque GOLES 1ER TIEMPO (Si está activo)
    if (activeMarkets.goles) {
        const p05HT = plattCalibrate(poissonOver(lambdas.lambdaGoal, 0.5), 'goals');
        const p15HT = plattCalibrate(poissonOver(lambdas.lambdaGoal, 1.5), 'goals');
        
        blocksHtml += `
            <div class="market-block">
                <div class="block-header">
                    <span class="block-title">⏱️ GOLES 1ER TIEMPO</span>
                    <span class="block-lambda">λ ${lambdas.lambdaGoal.toFixed(2)}</span>
                </div>
                ${renderProgressBarRow('+0.5 HT', poissonOver(lambdas.lambdaGoal, 0.5), 'goals')}
                ${renderProgressBarRow('+1.5 HT', poissonOver(lambdas.lambdaGoal, 1.5), 'goals')}
            </div>`;
            
        recommendationsArray.push({ label: 'GOL HT OVER 0.5', prob: p05HT, desc: 'Acción rápida en la primera mitad' });
    }

    // Bloque AMBOS MARCAN (Si está activo)
    if (activeMarkets.btts) {
        const rawBTTS = (1 - poissonProb(0, lambdas.lambdaH)) * (1 - poissonProb(0, lambdas.lambdaA)) * 100 * (LIGAS[currentLeagueKey]?.btts_factor || 1.0);
        const pBTTS = plattCalibrate(rawBTTS, 'btts');
        
        blocksHtml += `
            <div class="market-block">
                <div class="block-header"><span class="block-title">🤝 AMBOS MARCAN</span></div>
                ${renderProgressBarRow('Ambos Marcan (Sí)', rawBTTS, 'btts')}
            </div>`;
            
        recommendationsArray.push({ label: 'AMBOS MARCAN (SÍ)', prob: pBTTS, desc: 'Intercambio de goles proyectado' });
    }

    // Bloque CÓRNERS (Si está activo)
    if (activeMarkets.corners) {
        const p75 = plattCalibrate(negBinOver(lambdas.lambdaCorn, 7.5, lambdas.negBinR), 'corners');
        
        blocksHtml += `
            <div class="market-block">
                <div class="block-header">
                    <span class="block-title">📐 CÓRNERS</span>
                    <span class="block-lambda">λ ${lambdas.lambdaCorn.toFixed(1)}</span>
                </div>
                ${renderProgressBarRow('+7.5 Córners', negBinOver(lambdas.lambdaCorn, 7.5, lambdas.negBinR), 'corners')}
                ${renderProgressBarRow('+8.5 Córners', negBinOver(lambdas.lambdaCorn, 8.5, lambdas.negBinR), 'corners')}
                ${renderProgressBarRow('+9.5 Córners', negBinOver(lambdas.lambdaCorn, 9.5, lambdas.negBinR), 'corners')}
                ${renderProgressBarRow('+10.5 Córners', negBinOver(lambdas.lambdaCorn, 10.5, lambdas.negBinR), 'corners')}
            </div>`;
            
        recommendationsArray.push({ label: 'CÓRNERS OVER 7.5', prob: p75, desc: 'Línea fluIda de saques de esquina' });
    }

    document.getElementById('blocks-container').innerHTML = blocksHtml;

    // Calcular y renderizar Tarjeta de Mejor Apuesta (Idéntica a Imagen 2)
    recommendationsArray.sort((a,b) => b.prob - a.prob);
    if (recommendationsArray.length > 0) {
        const best = recommendationsArray[0];
        const second = recommendationsArray[1] || { label: 'N/A', prob: 0 };
        const third = recommendationsArray[2] || { label: 'N/A', prob: 0 };
        
        document.getElementById('recommendation-box').innerHTML = `
            <div class="rec-card">
                <div class="rec-tag">⭐ MEJOR APUESTA</div>
                <div class="rec-value">${best.label}</div>
                <div class="rec-desc">${best.desc}</div>
                <div class="rec-badge-conf">${best.prob.toFixed(0)}% CONFIANZA ALTA</div>
                <div class="rec-secondary">
                    <div class="sec-title">🔎 OTRAS OPCIONES</div>
                    <div class="sec-row"><span>#2 ${second.label}</span><span>${second.prob.toFixed(0)}%</span></div>
                    <div class="sec-row"><span>#3 ${third.label}</span><span>${third.prob.toFixed(0)}%</span></div>
                </div>
            </div>`;
    }

    document.getElementById('output-dashboard').style.display = 'block';
}

// ==========================================
// INICIALIZACIÓN DE CONTROLES DE INTERFAZ
// ==========================================
function updateTeamDropdowns() {
    const league = LIGAS[currentLeagueKey];
    const homeSelect = document.getElementById('select-home');
    const awaySelect = document.getElementById('select-away');
    
    homeSelect.innerHTML = ''; awaySelect.innerHTML = '';
    league.teams.forEach(t => {
        homeSelect.insertAdjacentHTML('beforeend', `<option value="${t}">${t}</option>`);
        awaySelect.insertAdjacentHTML('beforeend', `<option value="${t}">${t}</option>`);
    });
    if(awaySelect.options[1]) awaySelect.selectedIndex = 1; // Seleccionar rival por defecto diferente
}

function buildLeaguePillsUI() {
    const container = document.getElementById('leagues-container');
    container.innerHTML = '';
    Object.keys(LIGAS).forEach(key => {
        const activeClass = key === currentLeagueKey ? 'active' : '';
        container.insertAdjacentHTML('beforeend', `<div class="league-pill ${activeClass}" data-league="${key}">${LIGAS[key].name}</div>`);
    });
    
    // Delegar eventos click a las píldoras de las ligas
    document.querySelectorAll('.league-pill').forEach(pill => {
        pill.addEventListener('click', (e) => {
            document.querySelectorAll('.league-pill').forEach(p => p.classList.remove('active'));
            e.target.classList.add('active');
            currentLeagueKey = e.target.dataset.league;
            updateTeamDropdowns();
        });
    });
}

// Manejo interactivo de los botones verdes de encendido/apagado de mercado
document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        const mkt = e.currentTarget.dataset.mkt;
        activeMarkets[mkt] = !activeMarkets[mkt];
        if(activeMarkets[mkt]) {
            e.currentTarget.classList.add('active');
            e.currentTarget.textContent = '🟢 ' + e.currentTarget.textContent.substring(2);
        } else {
            e.currentTarget.classList.remove('active');
            e.currentTarget.textContent = '🔴 ' + e.currentTarget.textContent.substring(2);
        }
    });
});

// Listener del botón de disparo de cálculos
document.getElementById('btn-calc-trigger').addEventListener('click', processAndRenderUI);

window.onload = () => {
    buildLeaguePillsUI();
    updateTeamDropdowns();
    
    // Cambiar estado visual de la API de forma controlada y segura
    const indicator = document.getElementById('api-indicator');
    indicator.className = "api-status";
    indicator.textContent = "🟢 BSD API + METRICAS XG V2.5 CONECTADAS";
};
</script>
