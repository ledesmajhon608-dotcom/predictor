<html lang="es">

    <meta charset="UTF-8">

    <style>

<body>

    <div id="engine-badge">Cargando motor estadístico...</div>

<script>
// ==========================================
// CONFIGURACIÓN, CONSTANTES Y BASES DE DATOS
// ==========================================
const BSD_BASE = 'https://api.bsdfootball.com/v1'; // Reemplaza por tu URL real de la API
const BSD_TOKEN = 'TU_TOKEN_AQUÍ'; // Reemplaza por tu token real

const DIXON_COLES_RHO = -0.05; // Ajuste de dependencia para marcadores bajos (0-0, 1-1, etc.)
let currentLeagueKey = 'DEFAULT';
let apiAvailable = false;
const bsdLeagueMap = {};

// Base de datos de ligas soportadas y sus configuraciones estáticas
const LIGAS = {
    'DEFAULT': { btts_factor: 1.0, mean_corners: 9.5 },
    'LA_LIGA': { btts_factor: 0.95, mean_corners: 9.2 },
    'PREMIER_LEAGUE': { btts_factor: 1.10, mean_corners: 10.1 },
    'SERIE_A': { btts_factor: 0.98, mean_corners: 9.4 },
    'LIGA_BETPLAY': { btts_factor: 0.88, mean_corners: 8.9 }
};

// Base de datos de fuerza de equipos (Ataque, Defensa, Córners y Elo)
const TEAM_STRENGTH_DB = {
    'Real Madrid': { atk: 1.4, def: 0.7, elo: 1950 },
    'Barcelona': { atk: 1.3, def: 0.8, elo: 1900 },
    'Manchester City': { atk: 1.5, def: 0.6, elo: 2000 },
    'Arsenal': { atk: 1.35, def: 0.65, elo: 1920 }
};

const CORNER_POWER = {
    'Real Madrid': { for: 6.2, against: 4.1 },
    'Barcelona': { for: 5.8, against: 4.3 },
    'Manchester City': { for: 7.1, against: 3.5 }
};

const ALTITUDE_TEAMS = {
    'Bolivar': 3640,
    'The Strongest': 3640,
    'LDU Quito': 2850
};

// ==========================================
// FUNCIONES MATEMÁTICAS Y ESTADÍSTICAS
// ==========================================

// Factorial para Poisson
function factorial(n) {
    if (n === 0 || n === 1) return 1;
    let r = 1;
    for (let i = 2; i <= n; i++) r *= i;
    return r;
}

// Probabilidad de Poisson exacta para 'k' eventos con media 'lambda'
function poissonProb(k, lambda) {
    return (Math.pow(lambda, k) * Math.exp(-lambda)) / factorial(k);
}

// Probabilidad acumulada de Poisson estricta por encima de una línea (Over)
function poissonOver(lambda, line) {
    let probUnder = 0;
    for (let k = 0; k <= Math.floor(line); k++) {
        probUnder += poissonProb(k, lambda);
    }
    return Math.max(0, Math.min(100, (1 - probUnder) * 100));
}

// Combinatoria para la distribución Binomial Negativa
function nCr(n, r) {
    if (r < 0 || r > n) return 0;
    return factorial(n) / (factorial(r) * factorial(n - r));
}

// Probabilidad de Binomial Negativa (para Córners)
function negBinProb(k, lambda, r) {
    const p = r / (r + lambda);
    return nCr(k + r - 1, k) * Math.pow(p, r) * Math.pow(1 - p, k);
}

// Probabilidad acumulada Over usando Distribución Binomial Negativa
function negBinOver(lambda, line, r) {
    let probUnder = 0;
    for (let k = 0; k <= Math.floor(line); k++) {
        probUnder += negBinProb(k, lambda, r);
    }
    return Math.max(0, Math.min(100, (1 - probUnder) * 100));
}

// Factor de corrección Dixon-Coles para refinar empates y bajas anotaciones
function dixonColesCorrection(x, y, lambdaH, lambdaA) {
    if (x === 0 && y === 0) return 1 - (lambdaH * lambdaA * DIXON_COLES_RHO);
    if (x === 1 && y === 0) return 1 + (lambdaA * DIXON_COLES_RHO);
    if (x === 0 && y === 1) return 1 + (lambdaH * DIXON_COLES_RHO);
    if (x === 1 && y === 1) return 1 - DIXON_COLES_RHO;
    return 1;
}

// Calibración de Platt para ajustar probabilidades matemáticas a la realidad de las apuestas
function plattCalibrate(rawProb, marketType) {
    let sigmoidA = -0.05, sigmoidB = 2.5; // Valores base por defecto
    
    switch(marketType) {
        case 'goals_over25': sigmoidA = -0.06; sigmoidB = 2.8; break;
        case 'btts':         sigmoidA = -0.04; sigmoidB = 2.1; break;
        case 'resultado':    sigmoidA = -0.05; sigmoidB = 2.4; break;
        case 'corners':      sigmoidA = -0.07; sigmoidB = 3.2; break;
    }
    
    const calibrated = 1 / (1 + Math.exp(sigmoidA * rawProb + sigmoidB));
    return Math.max(1, Math.min(99, calibrated * 100));
}

// Cálculo del mercado Ambos Marcan (BTTS) cruzando las matrices de Poisson
function calcBTTS(lambdaH, lambdaA, leagueKey) {
    const pH0 = poissonProb(0, lambdaH);
    const pA0 = poissonProb(0, lambdaA);
    const rawBTTS = (1 - pH0) * (1 - pA0) * 100;
    const factor = LIGAS[leagueKey]?.btts_factor || 1.0;
    return rawBTTS * factor;
}

// Matriz completa 1X2 resolviendo Dixon-Coles y sumando probabilidades
function calcResultProbs(lambdaH, lambdaA, leagueKey) {
    let home = 0, draw = 0, away = 0;
    const maxGoals = 12; // Límite superior de la matriz expansiva
    
    for (let h = 0; h <= maxGoals; h++) {
        for (let a = 0; a <= maxGoals; a++) {
            let p = poissonProb(h, lambdaH) * poissonProb(a, lambdaA);
            p *= dixonColesCorrection(h, a, lambdaH, lambdaA);
            
            if (h > a) home += p;
            else if (h === a) draw += p;
            else away += p;
        }
    }
    
    const total = home + draw + away;
    return { home: (home / total) * 100, draw: (draw / total) * 100, away: (away / total) * 100 };
}

// Banda de incertidumbre estadística según tamaño de muestra histórco disponible
function uncertaintyBand(prob, totalMatches) {
    const z = 1.96; // 95% Nivel de confianza
    const p = prob / 100;
    const margin = z * Math.sqrt((p * (1 - p)) / totalMatches) * 100;
    return { min: Math.max(0, prob - margin), max: Math.min(100, prob + margin) };
}

// ==========================================
// SISTEMA DE RECOMENDACIONES (ALGORITMO DE VALOR)
// ==========================================
function buildRecommendation(marketsArray) {
    // Filtrar mercados viables que superen umbrales de confianza mínimos
    const valid = marketsArray.filter(m => m.prob >= 55);
    if (valid.length === 0) return { top: null, top3: [], isAggressive: false };
    
    // Ordenar de mayor a menor probabilidad calculada
    valid.sort((a, b) => b.prob - a.prob);
    
    const top = valid[0];
    let confidenceLevel = 'baja';
    let diamond = '';
    
    if (top.prob >= 75) { confidenceLevel = 'alta'; diamond = '💎'; }
    else if (top.prob >= 65) { confidenceLevel = 'media'; }
    
    const isAggressive = top.prob < 68 && (top.type === 'resultado' || top.type === 'ht');
    top.confidenceLevel = confidenceLevel;
    top.diamond = diamond;
    
    return { top, top3: valid.slice(0, 3), isAggressive };
}

// ==========================================
// INTERFAZ DE USUARIO, COMPONENTES Y RENDERIZADO
// ==========================================
function renderLeaguePills() { /* Lógica visual para renderizar píldoras de liga */ }
function renderMarketToggles() { /* Lógica visual para los interruptores de mercados */ }
function setApiStatus(status, text) { console.log(`[API STATUS: ${status}] ${text}`); }

function mktCard(title, rawProb, type, id, alternativeLabel) {
    const calibrated = plattCalibrate(rawProb, type);
    return `
        <div class="mkt-card animate-in" id="card-${id}">
            <div class="mkt-card-title">${title}</div>
            <div class="mkt-card-prob">${calibrated.toFixed(1)}%</div>
            <div class="mkt-card-alt">${alternativeLabel}: ${(100 - calibrated).toFixed(1)}%</div>
        </div>`;
}

function matchLeagueName(apiName, localKey) {
    return apiName.toLowerCase().replace(/[^a-z0-9]/g, '') === localKey.toLowerCase().replace(/[^a-z0-9]/g, '');
}

// Función principal de renderizado de analíticas y cálculo de mercados
function renderDashboard(home, away, lambdaH, lambdaA, lambdaGoal, lambdaCorn, negBinR, mkt, totalMatchesUsed) {
    let html = '';
    
    if(mkt.corn){
        html += `<div class="section-header animate-in"><span class="section-icon">⬡</span><span class="section-title">CÓRNERS</span><span class="section-lambda">λ <span>${lambdaCorn} · r=${negBinR}</span></span><span class="cal-badge">✓ Calibrado</span></div>`;
        [7.5, 8.5, 9.5, 10.5].forEach((line, i) => {
            html += mktCard(`+${line}`, negBinOver(lambdaCorn, line, negBinR), 'corners', i + 4, 'Under');
        });
    }
    
    // Inyectamos el listado inicial de bloques en el contenedor global
    document.getElementById('all-markets-container').innerHTML = html;
    
    // --- EVALUACIÓN Y COMPILACIÓN DE MERCADOS PARA EL MOTOR DE APUESTAS ---
    const all = [];
    
    if(mkt.goles){
        const l = lambdaH + lambdaA;
        all.push({label: 'GOLES OVER 1.5', prob: Math.round(plattCalibrate(poissonOver(l, 1.5), 'goals_over15')), desc: 'Alta prob. de partido con goles', type: 'goles'});
        all.push({label: 'GOLES OVER 2.5', prob: Math.round(plattCalibrate(poissonOver(l, 2.5), 'goals_over25')), desc: '3+ goles en el partido', type: 'goles'});
    }
    if(mkt.ht){
        all.push({label: 'GOL HT OVER 0.5', prob: Math.round(plattCalibrate(poissonOver(lambdaGoal, 0.5), 'goals_ht05')), desc: 'Al menos un gol antes del descanso', type: 'ht'});
        all.push({label: 'GOL HT OVER 1.5', prob: Math.round(plattCalibrate(poissonOver(lambdaGoal, 1.5), 'goals_ht15')), desc: '2+ goles en el primer tiempo', type: 'ht'});
    }
    if(mkt.btts){
        const bp = Math.round(plattCalibrate(calcBTTS(lambdaH, lambdaA, currentLeagueKey), 'btts'));
        all.push({label: 'AMBOS MARCAN', prob: bp, desc: `${bp}% de prob. que ambos anoten`, type: 'btts'});
    }
    if(mkt.corn){
        [7.5, 8.5, 9.5].forEach(line => {
            all.push({label: `CÓRNERS OVER ${line}`, prob: Math.round(plattCalibrate(negBinOver(lambdaCorn, line, negBinR), 'corners')), desc: `Sobre ${line} córners`, type: 'corners'});
        });
    }
    
    const rp = calcResultProbs(lambdaH, lambdaA, currentLeagueKey);
    const rph = +plattCalibrate(rp.home, 'resultado').toFixed(1);
    const rpd = +plattCalibrate(rp.draw, 'resultado').toFixed(1);
    const rpa = +plattCalibrate(rp.away, 'resultado').toFixed(1);
    
    all.push({label: 'VICTORIA LOCAL', prob: rph, desc: `${home.split(' ').slice(-1)[0]} favorito`, type: 'resultado'});
    all.push({label: 'VICTORIA VISITANTE', prob: rpa, desc: `${away.split(' ').slice(-1)[0]} favorito`, type: 'resultado'});
    
    // --- FILTRADO Y RENDERIZADO DEL CONTENEDOR DE RECOMENDACIÓN DESTACADA ---
    const rec = buildRecommendation(all);
    
    if(!rec.top){
        document.getElementById('recomendacion-container').innerHTML = `
            <div class="recomendacion animate-in" style="border-color:rgba(255,77,90,0.25);">
                <div class="rec-title" style="color:var(--accent);">SIN APUESTA CLARA</div>
                <div class="rec-main" style="color:var(--accent);font-size:1.2rem;">SIN APUESTA CLARA</div>
                <div class="rec-sub">Ningún mercado supera el umbral de confianza mínimo</div>
            </div>`;
    } else {
        const tb = rec.top;
        const cls = tb.prob >= 70 ? 'var(--green)' : tb.prob >= 60 ? 'var(--yellow)' : 'var(--accent)';
        const gl = cls === 'var(--green)' ? 'rgba(46,204,113,0.5)' : cls === 'var(--yellow)' ? 'rgba(255,182,39,0.5)' : 'rgba(255,77,90,0.5)';
        const conf = tb.confidenceLevel === 'alta' ? 'CONFIANZA ALTA' : tb.confidenceLevel === 'media' ? 'CONFIANZA MEDIA' : 'ALTO RIESGO';
        
        let top3h = '';
        if(rec.top3.length > 1){
            top3h = rec.top3.slice(1).map((b, i) => {
                const c = b.prob >= 70 ? 'var(--green)' : b.prob >= 60 ? 'var(--yellow)' : 'var(--accent)';
                return `
                    <div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid rgba(255,255,255,0.05);">
                        <span style="font-size:0.75rem;opacity:0.6;">#${i+2}</span>
                        <span style="flex:1;font-weight:600;font-size:0.8rem;">${b.label}</span>
                        <span style="font-family:'Bebas Neue';font-size:1rem;color:${c};">${Number(b.prob).toFixed(0)}%</span>
                        ${b.diamond ? `<span style="font-size:0.9rem;">${b.diamond}</span>` : ''}
                    </div>`;
            }).join('');
        }
        
        document.getElementById('recomendacion-container').innerHTML = `
            <div class="recomendacion animate-in" style="border-color:${rec.isAggressive ? 'rgba(255,77,90,0.4)' : 'rgba(46,204,113,0.4)'};">
                <div class="rec-title" style="color:${rec.isAggressive ? 'var(--accent)' : 'var(--green)'};">${rec.isAggressive ? '⚡ APUESTA AGRESIVA' : '🎯 MEJOR APUESTA'}</div>
                <div class="rec-main" style="color:${cls};text-shadow:0 0 20px ${gl};">${tb.label} ${tb.diamond || ''}</div>
                <div class="rec-sub">${tb.desc}</div>
                <div class="rec-confidence" style="border-color:${cls};">
                    <span class="rc-pct" style="color:${cls}">${Number(tb.prob).toFixed(0)}%</span>
                    <span class="rc-label">${conf}</span>
                </div>
                ${top3h ? `<div style="margin-top:14px;text-align:left;"><div style="font-size:0.6rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;">🔎 OTRAS OPCIONES</div>${top3h}</div>` : ''}
            </div>`;
    }
}

// Muestra las cajas con las probabilidades del 1X2 calibradas en la UI principal
function renderResultBoxes(lH, lA){
    const rp = calcResultProbs(lH, lA, currentLeagueKey);
    const r = {
        home: +plattCalibrate(rp.home, 'resultado').toFixed(1),
        draw: +plattCalibrate(rp.draw, 'resultado').toFixed(1),
        away: +plattCalibrate(rp.away, 'resultado').toFixed(1)
    };
    const mx = Math.max(r.home, r.draw, r.away);
    const rc = v => v === mx ? 'var(--green)' : v >= 30 ? 'var(--yellow)' : 'var(--accent)';
    const rg = v => v === mx ? 'rgba(46,204,113,0.3)' : v >= 30 ? 'rgba(255,182,39,0.3)' : 'rgba(255,77,90,0.3)';
    
    return `
        <div class="result-boxes">
            <div class="result-box">
                <div class="rb-label">🏠 Local</div>
                <div class="rb-pct" style="color:${rc(r.home)};text-shadow:0 0 15px ${rg(r.home)};">${r.home}%</div>
            </div>
            <div class="result-box rb-center">
                <div class="rb-label">🟡 Empate</div>
                <div class="rb-pct" style="color:${rc(r.draw)};text-shadow:0 0 15px ${rg(r.draw)};">${r.draw}%</div>
            </div>
            <div class="result-box">
                <div class="rb-label">✈️ Visitante</div>
                <div class="rb-pct" style="color:${rc(r.away)};text-shadow:0 0 15px ${rg(r.away)};">${r.away}%</div>
            </div>
        </div>`;
}

// Transición animada para rellenar las barras porcentuales de la interfaz
function animateBars(){
    document.querySelectorAll('.bar-fill[data-target]').forEach(b => b.style.width = b.dataset.target + '%');
}

// Orquestador de carga inicial y conexión con el backend de BSD API
window.onload = async () => {
    renderLeaguePills();
    renderMarketToggles();
    setApiStatus('error', '🟡 Conectando con BSD API...');
    
    try {
        let all = [], url = BSD_BASE + '/leagues/?page_size=100', p = 0;
        
        // Paginación controlada con protección Race Condition anti-bloqueos
        while(url && p < 5){
            const fp = fetch(url, { headers: { 'Authorization': 'Token ' + BSD_TOKEN } });
            const tp = new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 8000));
            const r = await Promise.race([fp, tp]);
            
            if(!r.ok) throw new Error('BSD ' + r.status);
            const d = await r.json();
            all = all.concat(d.results || []);
            url = d.next || null;
            p++;
        }
        
        // Mapeo automático de ligas activas (omitir ligas femeninas del modelo de datos por consistencia)
        all.forEach(l => {
            if (l.is_women) return;
            if (!l.current_season?.id) return;
            for (const c of Object.keys(LIGAS)) {
                if (matchLeagueName(l.name, c) && !bsdLeagueMap[c]) {
                    bsdLeagueMap[c] = { bsdId: l.id, seasonId: l.current_season.id };
                }
            }
        });
        
        const mapped = Object.keys(bsdLeagueMap).length;
        if(mapped > 0){
            setApiStatus('live', '🟢 BSD API — ' + mapped + '/' + Object.keys(LIGAS).length + ' ligas activas');
            apiAvailable = true;
            document.getElementById('engine-badge').textContent = '🛰 BSD + Elo + Atk×Def + xG + Altitud · v2.1';
        }
    } catch(e) {
        setApiStatus('error', '🟡 Sin conexión — usando datos offline');
    }
};
</script>
