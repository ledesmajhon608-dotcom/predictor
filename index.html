<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Prueba API BSD</title>
</head>
<body>
  <h3>Resultado de la API:</h3>
  <pre id="salida" style="background:#eee;padding:10px;">Esperando...</pre>

  <script>
    (async function() {
      const API_KEY = 'd1c591c865f3f9dd0d9f8d60337c895a94c4683e';
      const BASE = 'https://sports.bzzoiro.com';

      // endpoints de ejemplo (ajusta según la documentación de tu API)
      const endpoints = [
        '/api/v1/leagues',
        '/api/v1/teams?league=39&season=2025',
        '/api/v1/teams/statistics?league=39&season=2025'
      ];

      const salida = document.getElementById('salida');
      salida.textContent = 'Conectando...';

      let resultados = '';
      for (let url of endpoints) {
        try {
          const res = await fetch(BASE + url, {
            headers: { 'Authorization': 'Bearer ' + API_KEY }
          });
          if (!res.ok) {
            resultados += `❌ ${url}: ${res.status} ${res.statusText}\n`;
            continue;
          }
          const data = await res.json();
          resultados += `✅ ${url}:\n${JSON.stringify(data, null, 2)}\n\n`;
        } catch (err) {
          resultados += `❌ ${url}: ${err.message}\n`;
        }
      }
      salida.textContent = resultados || 'Sin respuesta.';
    })();
  </script>
</body>
</html>
