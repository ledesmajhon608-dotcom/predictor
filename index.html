<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOOTBALL BET</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#0a0e17; --card:rgba(16,20,32,0.7); --border:rgba(255,255,255,0.08);
            --text:#f0f2f8; --muted:#7b8aa6; --accent:#ff4d5a; --accent-glow:rgba(255,77,90,0.5);
            --green:#2ecc71; --green-glow:rgba(46,204,113,0.5); --yellow:#ffb627;
            --glass-bg:rgba(255,255,255,0.03);
        }
        *{box-sizing:border-box;margin:0;padding:0;}
        body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;display:flex;justify-content:center;padding:20px 15px;}
        .container{width:100%;max-width:440px;}
        .header{text-align:center;padding:28px 20px;background:var(--glass-bg);backdrop-filter:blur(20px);border-radius:20px;border:1px solid var(--border);margin-bottom:8px;}
        .logo{font-family:'Bebas Neue',sans-serif;font-size:3rem;letter-spacing:4px;color:white;}
        .logo span{color:var(--accent);}
        .card{background:var(--card);backdrop-filter:blur(24px);border-radius:20px;padding:22px;border:1px solid var(--border);margin-bottom:14px;}
        .api-status{display:flex;align-items:center;gap:10px;font-size:0.66rem;font-weight:700;margin-bottom:16px;padding:10px;border-radius:12px;background:rgba(0,0,0,0.2);border:1px solid var(--border);}
        .api-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);}
        .api-dot.live{background:var(--green);box-shadow:0 0 10px var(--green-glow);}
        .api-dot.error{background:var(--yellow);}
        .league-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
        .league-pill{padding:8px 12px;border-radius:20px;border:1px solid var(--border);background:var(--glass-bg);color:var(--muted);font-size:0.75rem;cursor:pointer;transition:0.3s;}
        .league-pill.active{background:var(--accent);color:white;border-color:var(--accent);}
        .team-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:15px;}
        select{width:100%;padding:12px;border-radius:10px;background:#161b2a;color:white;border:1px solid var(--border);outline:none;}
        .calc-btn{width:100%;padding:16px;border-radius:15px;border:none;background:var(--accent);color:white;font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:2px;cursor:pointer;}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">FOOTBALL<span>BET</span></div>
    </div>
    <div class="card">
        <div class="api-status">
            <div class="api-dot" id="api-dot"></div>
            <span id="api-status-text">ESPERANDO SELECCIÓN...</span>
        </div>
        <div class="league-pills" id="league-pills"></div>
        <div class="team-grid">
            <div><label style="font-size: 0.7rem; color: var(--muted);">🏠 LOCAL</label>
                <select id="home-team" disabled><option>— Selecciona liga —</option></select>
            </div>
            <div><label style="font-size: 0.7rem; color: var(--muted);">✈️ VISITANTE</label>
                <select id="away-team" disabled><option>— Selecciona liga —</option></select>
            </div>
        </div>
        <button class="calc-btn">CALCULAR PROBABILIDADES</button>
    </div>
</div>

<script>
// CONFIGURACIÓN
const BSD_TOKEN = 'd1c591c865f3f9dd0d9f8d60337c895a94c4683e';
const BSD_BASE = 'https://sports.bzzoiro.com/api';

// Lista de equipos manual (Backup por si falla la API)
const BACKUP_TEAMS = {
    "PL": ["Arsenal", "Man City", "Liverpool", "Chelsea", "Man Utd", "Tottenham", "Newcastle", "Aston Villa"],
    "BL1": ["Bayern Munich", "Dortmund", "Leverkusen", "Leipzig", "Stuttgart", "Frankfurt", "Freiburg", "Wolfsburg"]
};

const LIGAS = {
    "PL": { name: "Premier League", bsd: "Premier League" },
    "BL1": { name: "Bundesliga", bsd: "Bundesliga" },
    "PD": { name: "La Liga", bsd: "La Liga" },
    "SA": { name: "Serie A", bsd: "Serie A" },
    "MXL": { name: "Liga MX", bsd: "Liga MX" }
};

function normalize(t) {
    return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
}

async function loadTeams(key) {
    const statusDot = document.getElementById('api-dot');
    const statusText = document.getElementById('api-status-text');
    const h = document.getElementById('home-team');
    const a = document.getElementById('away-team');
    
    statusDot.className = 'api-dot error';
    statusText.innerText = "CONECTANDO...";

    try {
        // Intento de conexión con la API
        const response = await fetch(`${BSD_BASE}/teams?league=${encodeURIComponent(LIGAS[key].bsd)}&token=${BSD_TOKEN}`);
        
        if (!response.ok) throw new Error("API Offline");
        
        const data = await response.json();
        
        h.innerHTML = '<option value="">— Selecciona Local —</option>';
        a.innerHTML = '<option value="">— Selecciona Visitante —</option>';

        if (data.teams && data.teams.length > 0) {
            data.teams.forEach(t => {
                const opt = new Option(t.name, t.id);
                h.add(opt.cloneNode(true));
                a.add(opt.cloneNode(true));
            });
            statusDot.className = 'api-dot live';
            statusText.innerText = `BSD — ${LIGAS[key].name} (${data.teams.length} EQUIPOS)`;
        } else {
            throw new Error("No hay datos");
        }
    } catch (e) {
        // MODO EMERGENCIA: Si la API falla, carga una lista básica para que puedas usar la app
        statusText.innerText = "ERROR API: USANDO BACKUP LOCAL";
        h.innerHTML = '<option>— Backup Mode —</option>';
        a.innerHTML = '<option>— Backup Mode —</option>';
        const list = BACKUP_TEAMS[key] || ["Equipo 1", "Equipo 2"];
        list.forEach(name => {
            h.add(new Option(name, name));
            a.add(new Option(name, name));
        });
    }
    h.disabled = false;
    a.disabled = false;
}

function init() {
    const container = document.getElementById('league-pills');
    Object.keys(LIGAS).forEach(key => {
        const p = document.createElement('div');
        p.className = 'league-pill';
        p.innerText = LIGAS[key].name;
        p.onclick = () => {
            document.querySelectorAll('.league-pill').forEach(x => x.classList.remove('active'));
            p.classList.add('active');
            loadTeams(key);
        };
        container.appendChild(p);
    });
}

window.onload = init;
</script>
</body>
</html>
