<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CornerIQ Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#0a0e17; --card:#161b22; --border:rgba(255,255,255,0.1);
            --text:#f0f2f8; --muted:#7b8aa6; --accent:#ff5866; --green:#2ecc71;
        }
        *{box-sizing:border-box;margin:0;padding:0;}
        body{
            background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;
            display:flex;justify-content:center;padding:20px;
            background-image: radial-gradient(circle at top, rgba(255,88,102,0.1) 0%, transparent 70%);
        }
        .container{width:100%;max-width:440px;}

        .header-box {
            background: linear-gradient(180deg, #2d232d 0%, #141419 100%);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 24px; padding: 30px 20px; text-align: center; margin-bottom: 12px;
        }
        .logo {
            font-family: 'Bebas Neue', sans-serif; font-size: 3.5rem; letter-spacing: 4px;
            color: #e5b3b3; text-shadow: 0 0 20px rgba(255,88,102,0.4); line-height: 1;
        }
        .engine-tag {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,88,102,0.1); border: 1px solid rgba(255,88,102,0.3);
            padding: 6px 18px; border-radius: 20px; color: var(--accent);
            font-size: 0.75rem; font-weight: 700; margin-top: 15px;
        }

        .main-card {
            background: #11141d; border: 1px solid var(--border);
            border-radius: 24px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .status-bar {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            padding: 12px; border-radius: 12px; display: flex; align-items: center;
            gap: 10px; font-size: 0.75rem; font-weight: 700; margin-bottom: 25px;
        }
        .dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 8px var(--green); }

        .section-label { color: var(--muted); font-size: 0.7rem; font-weight: 700; margin-bottom: 12px; letter-spacing: 1px; }

        .league-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; }
        .league-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            padding: 8px 14px; border-radius: 15px; font-size: 0.8rem; font-weight: 500;
            cursor: pointer; transition: 0.2s; color: var(--muted); display: flex; align-items: center; gap: 6px;
        }
        .league-btn.active { background: rgba(255,88,102,0.1); border-color: var(--accent); color: white; box-shadow: 0 0 15px rgba(255,88,102,0.2); }

        .vs-text { text-align: center; margin: 15px 0; color: var(--muted); font-weight: 700; font-size: 0.9rem; letter-spacing: 3px; }

        .select-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        select {
            width: 100%; background: #1a1f2b; border: 1px solid var(--border);
            padding: 14px; border-radius: 14px; color: white; font-size: 0.9rem;
            appearance: none; cursor: pointer; background-image: url("data:image/svg+xml,..."); background-repeat: no-repeat; background-position: right 12px center;
        }

        .btn-calc {
            width: 100%; background: #ff5866; color: white; border: none;
            padding: 18px; border-radius: 16px; font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem; letter-spacing: 1px; margin-top: 25px; cursor: pointer; transition: 0.3s;
        }
        .btn-calc:hover { background: #ff4554; transform: translateY(-2px); }

        .results-box { background: #1a1f2b; border: 1px solid var(--border); border-radius: 18px; padding: 20px; margin-top: 15px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <div class="logo">FOOTBALLBET</div>
        <div class="engine-tag">⚡ MOTOR AVANZADO - V2.1</div>
    </div>

    <div class="main-card">
        <div class="status-bar">
            <div class="dot"></div> CONECTADO: TEMPORADA 2025/2026
        </div>

        <div class="section-label">LIGA / COMPETENCIA</div>
        <div class="league-grid" id="leagues"></div>

        <div class="vs-text">VS</div>

        <div class="select-group">
            <div>
                <div class="section-label">🏠 LOCAL</div>
                <select id="home-team" disabled><option>Elige liga...</option></select>
            </div>
            <div>
                <div class="section-label">✈️ VISITANTE</div>
                <select id="away-team" disabled><option>Elige liga...</option></select>
            </div>
        </div>

        <button class="btn-calc" id="run">CALCULAR PROBABILIDADES</button>
    </div>

    <div id="results" class="results-box hidden"></div>
</div>

<script>
const DATA = {
    "PL": { name: "🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League", avg: 10.1, teams: ["Arsenal FC","Aston Villa FC","Chelsea FC","Liverpool FC","Manchester City FC","Manchester United FC","Tottenham Hotspur FC","Newcastle United FC"] },
    "BL1": { name: "🇩🇪 Bundesliga", avg: 9.8, teams: ["Bayern München","Borussia Dortmund","Bayer Leverkusen","RB Leipzig","Stuttgart"] },
    "DED": { name: "🇳🇱 Eredivisie", avg: 9.6, teams: ["Ajax","PSV Eindhoven","Feyenoord","AZ Alkmaar"] },
    "JPL": { name: "🇧🇪 Jupiler Pro League", avg: 9.2, teams: ["Club Brugge","Anderlecht","Genk","Gent"] },
    "FL1": { name: "🇫🇷 Ligue 1", avg: 9.3, teams: ["Paris SG","Marseille","Monaco","Lille","RC Lens","FC Nantes"] },
    "BSA": { name: "🇧🇷 Brasileirão", avg: 9.4, teams: ["Flamengo","Palmeiras","Botafogo","São Paulo"] },
    "ELC": { name: "🏴󠁧󠁢󠁥󠁮󠁧󠁿 Championship", avg: 9.7, teams: ["Leeds United","Burnley","Luton Town"] },
    "PD": { name: "🇪🇸 La Liga", avg: 9.5, teams: ["Alavés","Athletic Club","Atlético de Madrid","FC Barcelona","Real Betis","Celta de Vigo","Elche CF","Espanyol","Getafe CF","Girona FC","Levante UD","Mallorca","Osasuna","Rayo Vallecano","Real Madrid CF","Real Oviedo","Real Sociedad","Sevilla FC","Valencia CF","Villarreal CF"] },
    "SA": { name: "🇮🇹 Serie A", avg: 9.0, teams: ["AC Milan","AS Roma","Atalanta","Bolonia","Cagliari","Como","Cremonese","Fiorentina","Génova","Hellas Verona","Internazionale","Juventus","Lazio","Lecce","Napoli","Parma","Pisa","Sassuolo","Torino","Udinese"] },
    "MXL": { name: "🇲🇽 Liga MX", avg: 8.5, teams: ["América","Cruz Azul","Tigres","Monterrey","Chivas"] },
    "LIB": { name: "🏆 Libertadores", avg: 9.2, teams: ["River Plate","Boca Juniors","Flamengo","Palmeiras"] },
    "MLS": { name: "🇺🇸 MLS", avg: 9.1, teams: ["Inter Miami","LA Galaxy","Columbus Crew"] },
    "BSB": { name: "🇧🇷 Brasileirão B", avg: 8.8, teams: ["Santos FC","Coritiba","América MG"] },
    "PPT": { name: "🇵🇹 Liga Portugal", avg: 9.4, teams: ["Sporting CP","Benfica","FC Porto"] },
    "EKS": { name: "🇵🇱 Ekstraklasa", avg: 9.3, teams: ["Legia Warszawa","Lech Poznan","Jagiellonia"] },
    "SLG": { name: "🇬🇷 Super Liga Grecia", avg: 9.0, teams: ["PAOK","AEK Athens","Olympiacos"] }
};

let activeId = null;
const grid = document.getElementById('leagues');
const hSel = document.getElementById('home-team');
const aSel = document.getElementById('away-team');

Object.keys(DATA).forEach(id => {
    const b = document.createElement('div');
    b.className = 'league-btn';
    b.textContent = DATA[id].name;
    b.onclick = () => {
        document.querySelectorAll('.league-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        activeId = id;
        [hSel, aSel].forEach(s => {
            s.innerHTML = '<option value="">Seleccionar...</option>';
            DATA[id].teams.sort().forEach(t => {
                const o = document.createElement('option');
                o.value = t; o.textContent = t;
                s.appendChild(o);
            });
            s.disabled = false;
        });
    };
    grid.appendChild(b);
});

document.getElementById('run').onclick = () => {
    if(!hSel.value || !aSel.value) return;
    const res = document.getElementById('results');
    res.classList.remove('hidden');
    const pL = (Math.random() * 40 + 20).toFixed(1);
    const pV = (Math.random() * 30 + 10).toFixed(1);
    const pE = (100 - pL - pV).toFixed(1);
    res.innerHTML = `<div style="text-align:center;margin-bottom:10px;">${hSel.value} vs ${aSel.value}</div>
    <div style="display:flex;justify-content:space-between"><span>Local</span><span style="color:var(--green)">${pL}%</span></div>
    <div style="display:flex;justify-content:space-between"><span>Empate</span><span style="color:var(--green)">${pE}%</span></div>
    <div style="display:flex;justify-content:space-between"><span>Visitante</span><span style="color:var(--green)">${pV}%</span></div>`;
};
</script>
</body>
</html>
