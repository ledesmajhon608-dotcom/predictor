        try {
            setApiStatus('live', '🟢 Cargando equipos...');
            let apiTeams = [];
            // 1. Por league ID
            try {
                let data = await bsdFetch('/teams/?league=' + bsdLeagueMap[key].bsdId + '&page_size=200');
                apiTeams = data.results || [];
            } catch(e) {}
            // 2. Por season ID
            try {
                let data = await bsdFetch('/teams/?season=' + bsdLeagueMap[key].seasonId + '&page_size=200');
                const bySeason = data.results || [];
                const exist = new Set(apiTeams.map(t => t.id));
                bySeason.forEach(t => { if (!exist.has(t.id)) apiTeams.push(t); });
            } catch(e) {}
            // 3. Si aún hay pocos, extraer de eventos
            if (apiTeams.length < 6) {
                try {
                    const events = await bsdFetchAll('/events/?season=' + bsdLeagueMap[key].seasonId + '&limit=100');
                    const tMap = new Map();
                    events.forEach(ev => {
                        if (ev.home_team_obj?.id) tMap.set(ev.home_team_obj.id, ev.home_team_obj);
                        if (ev.away_team_obj?.id) tMap.set(ev.away_team_obj.id, ev.away_team_obj);
                    });
                    const fromEv = [...tMap.values()];
                    const exist = new Set(apiTeams.map(t => t.id));
                    fromEv.forEach(t => { if (!exist.has(t.id)) apiTeams.push(t); });
                } catch(e) {}
            }
            // Unificar por ID
            const uniq = Array.from(new Map(apiTeams.map(t => [t.id, t])).values());
            console.log(`[API] ${uniq.length} equipos en ${key}`);
            
            // Mapear cada equipo API a su nombre offline (para TEAM_STRENGTH y CORNER_POWER)
            const offlineTeams = liga.teams;
            const offlineMap = new Map();
            offlineTeams.forEach(offName => {
                const apiTeam = findTeamInAPI(offName, uniq);
                if (apiTeam) offlineMap.set(apiTeam.id, offName);
            });
            
            // Llenar selects con nombres de la API y guardar el ID y el nombre offline
            const selectTeams = uniq.map(t => {
                const offName = offlineMap.get(t.id) || null;
                return { apiName: t.name, bsdId: t.id, offlineName: offName };
            }).sort((a,b) => a.apiName.localeCompare(b.apiName));
            
            hSel.innerHTML = aSel.innerHTML = '<option value="">— Seleccionar —</option>';
            selectTeams.forEach(t => {
                const opt = new Option(t.apiName, t.apiName);
                // Guardamos el bsdId y offlineName en el propio option (dataset)
                opt.dataset.bsdId = t.bsdId;
                opt.dataset.offlineName = t.offlineName || '';
                hSel.add(opt.cloneNode(true));
                aSel.add(opt.cloneNode(true));
            });
            
            // Actualizar teamMap con los nombres API (los que se usarán en los selects)
            selectTeams.forEach(t => {
                teamMap[t.apiName] = { bsdId: t.bsdId, offlineName: t.offlineName };
            });
            
            setApiStatus('live', `🟢 BSD — ${selectTeams.length} equipos (temporada activa)`);
            // Iniciar cálculo de Elo y promedios de temporada en segundo plano
            try {
                await calculateEloAndSeasonStats(bsdLeagueMap[key].bsdId, bsdLeagueMap[key].seasonId);
            } catch(e) {}
        } catch(e) {
            console.error('[loadTeams] Fallo API:', e);
            // Fallback a lista offline
            fillWithOfflineTeams(liga.teams);
            setApiStatus('error', '🟡 Equipos offline — usando lista local');
        }
    } else {
        // Sin API
        fillWithOfflineTeams(liga.teams);
        setApiStatus('error', '🟡 ' + liga.name + ' — datos offline (liga no en API)');
    }
}

async function bsdFetch(path, timeoutMs = API_TIMEOUT) {
    const fetchPromise = fetch(`${BSD_BASE}${path}`, {headers:{'Authorization':`Token ${BSD_TOKEN}`}});
    const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), timeoutMs));
    const res = await Promise.race([fetchPromise, timeoutPromise]);
    if (!res.ok) throw new Error(`BSD ${res.status}`);
    return res.json();

// ---- Elo + promedios de temporada (MEJORADO) ----
async function calculateEloAndSeasonStats(leagueId, seasonId) {
    const cacheKey = `${leagueId}_${seasonId}`;
    if (eloRatings[cacheKey] && teamSeasonStatsCache[cacheKey]) return;
    
    try {
        const events = await bsdFetchAll(`/events/?season=${seasonId}&league=${leagueId}&limit=500`);
        if (!events || events.length < 10) throw new Error('Pocos eventos');
        events.sort((a,b) => new Date(a.start_date||a.date) - new Date(b.start_date||b.date));
        
        const ratings = {};
        const goalStats = {}; // { teamName: { goalsFor:0, goalsAgainst:0, played:0 } }
        const K = 32;
        
        events.forEach(match => {
            const homeName = match.home_team_obj?.name;
            const awayName = match.away_team_obj?.name;
            if (!homeName || !awayName) return;
            const homeScore = Number(match.home_score || 0);
            const awayScore = Number(match.away_score || 0);
            const status = (match.status || '').toUpperCase();
            if (!['FT','FINISHED','AET','PEN','FULL_TIME'].includes(status) && !status.includes('FT')) return;
            
            // Elo
            if (!ratings[homeName]) ratings[homeName] = { elo:1500, matches:0 };
            if (!ratings[awayName]) ratings[awayName] = { elo:1500, matches:0 };
            const homeElo = ratings[homeName].elo;
            const awayElo = ratings[awayName].elo;
            const expectedHome = 1 / (1 + Math.pow(10, (awayElo-homeElo)/400));
            const actualHome = homeScore > awayScore ? 1 : homeScore === awayScore ? 0.5 : 0;
            ratings[homeName].elo = homeElo + K * (actualHome - expectedHome);
            ratings[awayName].elo = awayElo + K * ((1-actualHome) - (1-expectedHome));
            ratings[homeName].matches++; ratings[awayName].matches++;
            
            // Goles por temporada
            if (!goalStats[homeName]) goalStats[homeName] = { goalsFor:0, goalsAgainst:0, played:0 };
            if (!goalStats[awayName]) goalStats[awayName] = { goalsFor:0, goalsAgainst:0, played:0 };
            goalStats[homeName].goalsFor += homeScore;
            goalStats[homeName].goalsAgainst += awayScore;
            goalStats[homeName].played++;
            goalStats[awayName].goalsFor += awayScore;
            goalStats[awayName].goalsAgainst += homeScore;
            goalStats[awayName].played++;
        });
        
        eloRatings[cacheKey] = ratings;
        teamSeasonStatsCache[cacheKey] = {};
        for (const [team, stats] of Object.entries(goalStats)) {
            if (stats.played > 0) {
                teamSeasonStatsCache[cacheKey][team] = {
                    goalsForAvg: stats.goalsFor / stats.played,
                    goalsAgainstAvg: stats.goalsAgainst / stats.played
                };
            }
        }
    } catch(e) {
        eloRatings[cacheKey] = {};
        teamSeasonStatsCache[cacheKey] = {};
    }
}

// ---- Funciones de fallback mejoradas que usan TEAM_STRENGTH y temporada ----
function getTeamStrengthFactor(teamName, leagueKey, role) {
    const liga = LIGAS[leagueKey];
    const str = (TEAM_STRENGTH[leagueKey] && TEAM_STRENGTH[leagueKey][teamName]) 
                || defaultStrengthFor(teamName, leagueKey);
    const baseAtk = str.atk;
    const baseDef = str.def;
    const homeAdv = str.homeAdv || 1.06;
    // Para el ataque: si es local, usa baseAtk * homeAdv, si visitante, baseAtk * 0.92
    const atkMult = role === 'home' ? baseAtk * homeAdv : baseAtk * 0.92;
    const defMult = role === 'home' ? baseDef * 0.95 : baseDef * 1.05;
    return { atkMult, defMult };
}

function fallbackGoals(teamName, role, liga, leagueKey) {
    const { atkMult } = getTeamStrengthFactor(teamName, leagueKey, role);
    return liga.goalsAvg / 2 * atkMult;
}

function fallbackGoals1T(teamName, role, liga, leagueKey) {
    const full = fallbackGoals(teamName, role, liga, leagueKey);
    return full * (role === 'home' ? 0.44 : 0.40);
}

function fallbackCorners(teamName, role, liga) {
    if (CORNER_POWER[teamName] && CORNER_POWER[teamName][role]) 
        return CORNER_POWER[teamName][role];
    const base = liga.cornersAvg / 2;
    return role === 'home' ? base * 1.10 : base * 0.90;
}
