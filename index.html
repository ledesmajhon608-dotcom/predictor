<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CornerIQ Pro - Elite Betting AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --card: #151921;
            --accent: #00ff88; /* Verde Neón para éxito */
            --accent-red: #ff3e3e;
            --text: #f0f2f5;
            --glass: rgba(255, 255, 255, 0.03);
        }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at top right, #1a2230, #0b0e14);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container { width: 100%; max-width: 480px; }

        /* HEADER */
        .logo { 
            font-family: 'Bebas Neue', sans-serif; 
            font-size: 3.5rem; 
            text-align: center;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .logo span { color: var(--accent); -webkit-text-fill-color: var(--accent); }

        /* CARD PRINCIPAL */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .label-group { margin-bottom: 20px; }
        label { 
            font-size: 0.65rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            color: #636e72; 
            font-weight: 700;
            display: block;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            background: var(--glass);
            border: 1px solid #2d3436;
            padding: 14px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            outline: none;
            transition: 0.3s;
        }

        select:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0, 255, 136, 0.2); }

        /* BOTÓN */
        .btn-main {
            width: 100%;
            padding: 18px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 14px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 10px;
        }

        .btn-main:hover { transform: scale(1.02); filter: brightness(1.1); box-shadow: 0 10px 20px rgba(0, 255, 136, 0.3); }

        /* ÁREA DE RESULTADO ANIMADA */
        .loading-bar {
            height: 4px; width: 0%; background: var(--accent);
            margin-top: 20px; border-radius: 2px; transition: 1.5s;
        }

        .result-card {
            margin-top: 25px;
            padding: 25px;
            border-radius: 20px;
            background: linear-gradient(145deg, #1a1f29, #151921);
            border-left: 5px solid var(--accent);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .confidence-meter {
            height: 8px; background: #2d3436; border-radius: 4px; margin: 15px 0; overflow: hidden;
        }
        .confidence-fill { height: 100%; background: var(--accent); border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">CORNER<span>IQ</span></div>
    
    <div class="card">
        <div class="label-group">
            <label>Competición Elite</label>
            <select id="league" onchange="loadTeams()">
                <option value="">Selecciona Liga</option>
                <option value="PL">Premier League 🏴󠁧󠁢󠁥󠁮󠁧󠁿</option>
                <option value="LL">La Liga 🇪🇸</option>
                <option value="LIB">Copa Libertadores 🏆</option>
            </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="label-group">
                <label>Escuadra Local</label>
                <select id="homeTeam"></select>
            </div>
            <div class="label-group">
                <label>Escuadra Visitante</label>
                <select id="awayTeam"></select>
            </div>
        </div>

        <button class="btn-main" onclick="processAnalysis()">ANALIZAR PROBABILIDADES</button>
        <div id="loader" class="loading-bar"></div>
    </div>

    <div id="results"></div>
</div>

<script>
    const TEAMS = {
        "PL": [
            { name: "Man. City", power: 95, corners: 7.2 },
            { name: "Arsenal", power: 92, corners: 6.5 },
            { name: "Liverpool", power: 93, corners: 6.8 }
        ],
        "LL": [
            { name: "Real Madrid", power: 94, corners: 5.9 },
            { name: "FC Barcelona", power: 89, corners: 5.5 }
        ],
        "LIB": [
            { name: "Flamengo", power: 88, corners: 6.2 },
            { name: "River Plate", power: 85, corners: 5.8 }
        ]
    };

    function loadTeams() {
        const league = document.getElementById('league').value;
        const h = document.getElementById('homeTeam');
        const v = document.getElementById('awayTeam');
        h.innerHTML = ""; v.innerHTML = "";
        
        if(TEAMS[league]) {
            TEAMS[league].forEach(t => {
                h.add(new Option(t.name, t.name));
                v.add(new Option(t.name, t.name));
            });
        }
    }

    function processAnalysis() {
        const loader = document.getElementById('loader');
        loader.style.width = "100%";
        
        setTimeout(() => {
            calculatePick();
            loader.style.width = "0%";
        }, 1500);
    }

    function calculatePick() {
        const league = document.getElementById('league').value;
        const hName = document.getElementById('homeTeam').value;
        const vName = document.getElementById('awayTeam').value;

        const home = TEAMS[league].find(t => t.name === hName);
        const away = TEAMS[league].find(t => t.name === vName);

        // Lógica de "Asertividad" mejorada
        const winProb = (home.power / (home.power + away.power)) * 100 + 5; // +5% localía
        const cornerAvg = (home.corners + away.corners).toFixed(1);
        
        let pick, mercado, confianza;

        if (winProb > 58) {
            pick = `GANA ${home.name.toUpperCase()}`;
            mercado = "Resultado Final (1X2)";
            confianza = winProb.toFixed(0);
        } else if (cornerAvg > 11) {
            pick = "+10.5 CORNERS";
            mercado = "Corners Asiáticos";
            confianza = 78;
        } else {
            pick = "AMBOS MARCAN";
            mercado = "Goles (BTTS)";
            confianza = 65;
        }

        document.getElementById('results').innerHTML = `
            <div class="result-card">
                <div style="font-size:0.7rem; color:var(--accent); font-weight:bold; letter-spacing:2px">PROCESAMIENTO IA COMPLETADO</div>
                <div style="font-family:'Bebas Neue'; font-size:2.5rem; margin:10px 0; color:white">${pick}</div>
                <div style="color:#636e72; font-size:0.9rem">Mercado Sugerido: <b>${mercado}</b></div>
                <div style="margin-top:15px">
                    <div style="display:flex; justify-content:space-between; font-size:0.8rem">
                        <span>Índice de Confianza</span>
                        <span>${confianza}%</span>
                    </div>
                    <div class="confidence-meter">
                        <div class="confidence-fill" style="width:${confianza}%"></div>
                    </div>
                </div>
            </div>
        `;
    }
</script>

</body>
</html>
